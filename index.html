function normName(s){ return String(s || '').toLocaleLowerCase('tr').replace(/\s+/g, ' ').trim(); }
function matchTeam(lg, name){
  const n = normName(name);
  if (!n) return '';
  return lg.teams.find(t => normName(t) === n)
    || lg.teams.find(t => normName(t).includes(n) || n.includes(normName(t)))
    || '';
}
function currentCumulative(lg, team){
  let cum = 0;
  (lg.pointsLog || []).filter(p => p.team === team)
    .slice().sort((a,b) => (a.addedAt||'').localeCompare(b.addedAt||''))
    .forEach(p => { cum = p.mode === 'cumulative' ? p.value : cum + p.value; });
  return cum;
}

function openStandingsModal(rows, purpose){
  const lg = state.current;
  const isPoints = purpose === 'points';
  const hasWeekly = rows.some(r => r.weekly != null);
  const hasTotal = rows.some(r => r.total != null);
  const hasSquad = rows.some(r => r.squad != null);
  if (isPoints && !hasWeekly && !hasTotal) toast('Görselde puan rozeti okunamadı, değerleri elle girebilirsin.');
  const model = rows.map(r => ({ ...r, team: matchTeam(lg, r.src), include: true }));
  const opt = { mode: (hasWeekly || !hasTotal) ? 'weekly' : 'cumulative', label: '' };

  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal" style="max-width:780px;">
      <h3>${isPoints ? 'Puan önizlemesi' : 'Kadro değeri önizlemesi'}</h3>
      <p class="sub" style="margin-top:-8px;">Görselden okunan değerleri kontrol et, gerekirse düzelt. Eşleşmeyen takımları listeden seç.</p>
      ${isPoints ? `
        <div class="grid2">
          <div class="field"><label>Etiket (örn. "3. hafta")</label><input id="sm-label" placeholder="opsiyonel"></div>
          <div class="field"><label>Hangi puan işlensin?</label>
            <select id="sm-mode">
              <option value="weekly" ${opt.mode==='weekly'?'selected':''}>Haftalık puan (çerçeveli rozet)</option>
              <option value="cumulative" ${opt.mode==='cumulative'?'selected':''}>Toplam puan (dolu rozet), sadece fark işlenir</option>
            </select>
          </div>
        </div>
        ${hasSquad ? `<label class="chk"><input type="checkbox" id="sm-squad" checked> Kadro değerlerini de güncelle</label>` : ''}
        ${lg.adminBonusEnabled ? `<label class="chk"><input type="checkbox" id="sm-rank"> Bu sıralamayı sıralama bonusu olarak da kaydet (görseldeki sıra kullanılır)</label>` : ''}
      ` : ''}
      <div style="overflow-x:auto;margin-top:6px;">
        <table class="data preview-table">
          <thead><tr><th></th><th>Görseldeki ad</th><th>Takım</th>${isPoints ? '<th class="amt">Haftalık</th><th class="amt">Toplam</th>' : ''}<th class="amt">Kadro değeri</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:16px;">
        <button id="sm-cancel" style="flex:0 0 auto;">Vazgeç</button>
        <div style="flex:1;"></div>
        <button class="primary" id="sm-save" style="flex:0 0 auto;">Kaydet</button>
      </div>
    </div>
  `);
  const tbody = modal.querySelector('tbody');
  const pointVal = r => opt.mode === 'weekly' ? r.weekly : r.total;
  function isDup(r){
    if (!isPoints || !r.team) return false;
    const v = pointVal(r);
    if (v == null) return false;
    const log = lg.pointsLog || [];
    if (log.some(p => p.team === r.team && p.mode === opt.mode && p.value === v && (p.label || '') === opt.label)) return true;
    if (opt.mode === 'cumulative' && log.some(p => p.team === r.team) && currentCumulative(lg, r.team) === v) return true;
    return false;
  }
  function resetIncludes(){ model.forEach(r => { r.include = !!r.team && !isDup(r); }); }
  function renderRows(){
    tbody.innerHTML = '';
    model.forEach(r => {
      const dup = isDup(r);
      const tr = el(`<tr style="${dup ? 'opacity:.55;' : ''}">
        <td><input type="checkbox" class="inc" style="width:auto;" ${r.include ? 'checked' : ''}></td>
        <td>${escapeHtml(r.src)}${dup ? '<div class="small muted">⚠ olası mükerrer</div>' : ''}${!r.team ? '<div class="small muted">eşleşmedi</div>' : ''}</td>
        <td><select class="tm"><option value="">— atla —</option>${lg.teams.map(t => `<option value="${escapeHtml(t)}" ${r.team === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join('')}</select></td>
        ${isPoints ? `<td class="amt"><input class="num wk" value="${r.weekly ?? ''}" style="text-align:right;width:70px;"></td>
        <td class="amt"><input class="num tt" value="${r.total ?? ''}" style="text-align:right;width:70px;"></td>` : ''}
        <td class="amt"><input class="num sq" value="${r.squad ?? ''}" style="text-align:right;min-width:120px;"></td>
      </tr>`);
      tr.querySelector('.inc').onchange = e => { r.include = e.target.checked; };
      tr.querySelector('.tm').onchange = e => { r.team = e.target.value; r.include = !!r.team && !isDup(r); renderRows(); };
      if (isPoints) {
        tr.querySelector('.wk').oninput = e => { r.weekly = toNum(e.target.value); };
        tr.querySelector('.tt').oninput = e => { r.total = toNum(e.target.value); };
      }
      tr.querySelector('.sq').oninput = e => { r.squad = toNum(e.target.value); };
      tbody.appendChild(tr);
    });
  }
  resetIncludes();
  renderRows();
  if (isPoints) {
    modal.querySelector('#sm-label').oninput = e => { opt.label = e.target.value.trim(); resetIncludes(); renderRows(); };
    modal.querySelector('#sm-mode').onchange = e => { opt.mode = e.target.value; resetIncludes(); renderRows(); };
  }
  modal.querySelector('#sm-cancel').onclick = () => overlay.remove();
  modal.querySelector('#sm-save').onclick = async () => {
    const chosen = model.filter(r => r.include && r.team);
    if (!chosen.length) { toast('Kaydedilecek satır seçilmedi.'); return; }
    const seen = new Set();
    for (const r of chosen) {
      if (seen.has(r.team)) { toast($t('"{name}" birden fazla satırda seçili.', { name: r.team })); return; }
      seen.add(r.team);
    }
    const parts = [];
    const base = Date.now();
    if (isPoints) {
      lg.pointsLog = lg.pointsLog || [];
      let n = 0;
      chosen.forEach((r, i) => {
        const v = pointVal(r);
        if (v == null) return;
        lg.pointsLog.push({ id: uid(), team: r.team, mode: opt.mode, value: v, label: opt.label, addedAt: new Date(base + i).toISOString() });
        n++;
      });
      if (n) parts.push($t('{n} takımın puanı işlendi', { n }));
    }
    const squadBox = modal.querySelector('#sm-squad');
    const doSquad = isPoints ? !!(squadBox && squadBox.checked) : true;
    if (doSquad) {
      lg.squadValues = lg.squadValues || {};
      let n = 0;
      chosen.forEach(r => { if (r.squad != null) { lg.squadValues[r.team] = { value: r.squad, updatedAt: nowIso() }; n++; } });
      if (n) parts.push($t('{n} kadro değeri güncellendi', { n }));
    }
    const rankBox = modal.querySelector('#sm-rank');
    if (rankBox && rankBox.checked) {
      const ranking = [...new Set(model.filter(r => r.team).map(r => r.team))];
      if (ranking.length !== lg.teams.length) {
        parts.push($t('sıralama bonusu kaydedilmedi (tüm takımlar eşleşmeli)'));
      } else {
        lg.adminBonusLog = lg.adminBonusLog || [];
        lg.adminBonusLog.push({ id: uid(), ranking, label: opt.label, addedAt: nowIso() });
        parts.push($t('sıralama bonusu kaydedildi'));
      }
    }
    overlay.remove();
    await persist();
    toast(parts.length ? parts.join(', ') + '.' : $t('Değişiklik yapılmadı.'));
  };
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

function isDuplicateTransfer(lg, tr){
  return (lg.transfers || []).some(x =>
    x.player.trim().toLowerCase() === tr.player.trim().toLowerCase() &&
    Math.abs(x.amount) === Math.abs(tr.amount) &&
    x.from.trim().toLowerCase() === tr.from.trim().toLowerCase() &&
    x.to.trim().toLowerCase() === tr.to.trim().toLowerCase()
  );
}

function openPreviewModal(parsedRows){
  const lg = state.current;
  const rows = parsedRows.map(r => ({ ...r, _dup: isDuplicateTransfer(lg, r), _include: !isDuplicateTransfer(lg, r) }));
  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal">
      <h3>${$t('Transfer önizlemesi ({n} satır)', { n: rows.length })}</h3>
      <p class="sub" style="margin-top:-8px;">Mükerrer olabilecek satırlar işaretlendi ve varsayılan olarak devre dışı bırakıldı. Kaydetmeden önce gözden geçir.</p>
      <div style="overflow-x:auto;">
        <table class="data preview-table">
          <thead><tr><th></th><th>Oyuncu</th><th>Kimden</th><th>Kime</th><th class="amt">Bedel</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="row" style="margin-top:16px;">
        <button id="cancel-preview" style="flex:0 0 auto;">İptal</button>
        <div style="flex:1;"></div>
        <button class="primary" id="confirm-preview" style="flex:0 0 auto;">Seçilenleri Kaydet</button>
      </div>
    </div>
  `);
  const tbody = modal.querySelector('tbody');
  function renderRows(){
    tbody.innerHTML = '';
    rows.forEach((r, i) => {
      const tr = el(`<tr style="${r._dup ? 'opacity:.55;' : ''}">
        <td><input type="checkbox" ${r._include?'checked':''} style="width:auto;"></td>
        <td><input value="${escapeHtml(r.player)}"></td>
        <td><input value="${escapeHtml(r.from)}"></td>
        <td><input value="${escapeHtml(r.to)}"></td>
        <td class="amt"><input class="num" value="${r.amount}" style="text-align:right;"></td>
        <td><button class="icon-btn" title="Satırı kaldır">✕</button></td>
      </tr>`);
      const [chk, playerI, fromI, toI, amtI] = tr.querySelectorAll('input');
      chk.onchange = () => rows[i]._include = chk.checked;
      playerI.oninput = () => rows[i].player = playerI.value;
      fromI.oninput = () => rows[i].from = fromI.value;
      toI.oninput = () => rows[i].to = toI.value;
      fromI.onchange = toI.onchange = () => renderRows();
      [[fromI, r.from], [toI, r.to]].forEach(([inp, nm]) => {
        if (canonName(lg, nm) === null) {
          inp.style.borderColor = 'var(--danger)';
          inp.parentElement.appendChild(el(`<div class="small neg">takım listesinde yok</div>`));
        }
      });
      amtI.oninput = () => rows[i].amount = parseAmount(amtI.value);
      tr.querySelector('button').onclick = () => { rows.splice(i,1); renderRows(); };
      if (r._dup) {
        const dupTd = tr.children[1];
        dupTd.appendChild(el(`<div class="small muted">⚠ olası mükerrer</div>`));
      }
      tbody.appendChild(tr);
    });
    if (!rows.length) tbody.appendChild(el(`<tr><td colspan="6" class="empty">Satır kalmadı.</td></tr>`));
  }
  renderRows();
  modal.querySelector('#cancel-preview').onclick = () => overlay.remove();
  modal.querySelector('#confirm-preview').onclick = async () => {
    const toAdd = rows.filter(r => r._include && r.player && r.from && r.to && !isNaN(r.amount));
    if (!toAdd.length) { toast('Kaydedilecek satır seçilmedi.'); return; }
    const unknown = [...new Set(toAdd.flatMap(r => [r.from, r.to]).filter(nm => canonName(lg, nm) === null).map(nm => nm.trim()))];
    if (unknown.length) {
      const ok = await showConfirm($t('Şu adlar takım listesinde yok: {names}. Bu adların geçtiği transferler bütçeye yansımaz (yazım farkı olabilir). Yine de kaydedilsin mi?', { names: unknown.join(', ') }), 'Yine de kaydet', false);
      if (!ok) return;
    }
    lg.transfers = lg.transfers || [];
    const base = Date.now();
    toAdd.forEach((r, i) => {
      const from = canonName(lg, r.from) || r.from.trim();
      const to = canonName(lg, r.to) || r.to.trim();
      lg.transfers.push({ id: uid(), player: r.player.trim(), amount: Math.abs(r.amount), from, to, addedAt: new Date(base + i).toISOString() });
    });
    overlay.remove();
    await persist();
    toast($t('{n} transfer kaydedildi.', { n: toAdd.length }));
  };
  overlay.appendChild(modal);
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

    </tr>`));
  });
  card.querySelector('.bl-save').onclick = async () => {
    const label = card.querySelector('.bl-label').value.trim();
    const mode = card.querySelector('.bl-mode').value;
    const entries = [];
    tbody.querySelectorAll('tr[data-team]').forEach(tr => {
      entries.push({ team: tr.dataset.team, pts: toNum(tr.querySelector('.pt').value), sq: toNum(tr.querySelector('.sq').value) });
    });
    const withPts = entries.filter(e => e.pts != null);
    const withSq = entries.filter(e => e.sq != null);
    if (!withPts.length && !withSq.length) { toast('En az bir değer gir.'); return; }
    const log = lg.pointsLog || [];
    const dups = withPts.filter(e => log.some(p => p.team === e.team && p.mode === mode && p.value === e.pts && (p.label || '') === label)
      || (mode === 'cumulative' && log.some(p => p.team === e.team) && currentCumulative(lg, e.team) === e.pts));
    if (dups.length) {
      const ok = await showConfirm($t('{names} için aynı puan daha önce girilmiş görünüyor. Yine de kaydedilsin mi?', { names: dups.map(d => d.team).join(', ') }), 'Yine de kaydet', false);
      if (!ok) return;
    }
    lg.pointsLog = log;
    const base = Date.now();
    withPts.forEach((e, i) => lg.pointsLog.push({ id: uid(), team: e.team, mode, value: e.pts, label, addedAt: new Date(base + i).toISOString() }));
    lg.squadValues = lg.squadValues || {};
    withSq.forEach(e => { lg.squadValues[e.team] = { value: e.sq, updatedAt: nowIso() }; });
    await persist();
    const parts = [];
    if (withPts.length) parts.push($t('{n} takımın puanı işlendi', { n: withPts.length }));
    if (withSq.length) parts.push($t('{n} kadro değeri güncellendi', { n: withSq.length }));
    toast(parts.join(', ') + '.');
  };
  return card;
}

      <div class="grid2">

  `);

    const label = formCard.querySelector('#p-label').value.trim();
    if (!team || isNaN(value)) { toast('Geçerli bir puan değeri gir.'); return; }
    lg.pointsLog = lg.pointsLog || [];
    lg.pointsLog.push({ id: uid(), team, mode, value, label, addedAt: nowIso() });
    await persist();
    toast('Puan bonusu eklendi.');
  };

  const logCard = el(`<div class="card"><h2>Puan kayıtları</h2><div id="p-log"></div></div>`);
  wrap.appendChild(logCard);
  const logEl = logCard.querySelector('#p-log');
  const sorted = (lg.pointsLog || []).slice().sort((a,b)=> (b.addedAt||'').localeCompare(a.addedAt||''));
  if (!sorted.length) { logEl.appendChild(el(`<div class="empty">Henüz puan kaydı yok.</div>`)); }
  else {
    const t = el(`<table class="data"><thead><tr><th>Takım</th><th>Tür</th><th class="amt">Değer</th><th class="amt">Bonus</th><th></th></tr></thead><tbody></tbody></table>`);
    const tbody = t.querySelector('tbody');
    sorted.forEach(p => {
      const row = el(`<tr>
        <td>${escapeHtml(p.team)}${p.label?`<div class="small muted">${escapeHtml(p.label)}</div>`:''}</td>
        <td>${p.mode==='cumulative'?'Toplam':'Bu hafta'}</td>
        <td class="amt num">${p.value}</td>
        <td class="amt num pos">+${fmt(computePointCredit(lg, p))}</td>
        <td style="text-align:right;"><button class="icon-btn" title="Sil">✕</button></td>
      </tr>`);
      row.querySelector('button').onclick = async () => {
        const ok = await showConfirm('Bu puan kaydını silmek istediğine emin misin?');
        if (!ok) return;
        lg.pointsLog = lg.pointsLog.filter(x => x.id !== p.id);
        await persist();
      };
      tbody.appendChild(row);
    });
    logEl.appendChild(t);
  }
  return wrap;
}
function computePointCredit(lg, entry){
  // recompute credited points for a single entry in its chronological context
  const sameTeam = (lg.pointsLog||[]).filter(p=>p.team===entry.team).slice().sort((a,b)=>(a.addedAt||'').localeCompare(b.addedAt||''));
  let cum = 0, credit = 0;
  for (const p of sameTeam) {
    if (p.mode === 'cumulative') { credit = p.value - cum; cum = p.value; }
    else { credit = p.value; cum += p.value; }
    if (p.id === entry.id) break;
  }
  return credit * (lg.pointBonusPerPoint || 10000);
}

// ---------- SIRALAMA (ADMIN BONUS) ----------
function renderSiralama(){
  const lg = state.current;
  const wrap = el(`<div></div>`);
  const toggleCard = el(`
    <div class="card">
      <h2>Sıralama (admin) bonusu</h2>
      <div class="sub">Bu bonus oyunun kuralı değildir, tamamen opsiyoneldir — lig admininin kendi belirlediği bir prim sistemidir.</div>
      <label style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="ab-enabled" style="width:auto;" ${lg.adminBonusEnabled?'checked':''}>
        Bu ligde sıralama bonusu uygulanıyor
      </label>
    </div>
  `);
  wrap.appendChild(toggleCard);
  toggleCard.querySelector('#ab-enabled').onchange = async (e) => {
    lg.adminBonusEnabled = e.target.checked;
    await persist();
  };

  if (lg.adminBonusEnabled) {
    const tableCard = el(`
      <div class="card">
        <h2>Bonus tablosu</h2>
        <div class="sub">Her sıra için verilecek tutarı belirle (takım sayısı kadar satır).</div>
        <div id="ab-table"></div>
        <button id="ab-save-table" class="primary" style="margin-top:10px;">Tabloyu Kaydet</button>
      </div>
    `);
    wrap.appendChild(tableCard);
    const tableEl = tableCard.querySelector('#ab-table');
    const n = lg.teams.length || 0;
    const values = [];
    for (let i=0;i<n;i++){
      values.push(lg.adminBonusTable[i] != null ? lg.adminBonusTable[i] : '');
      const row = el(`<div class="row" style="align-items:center;margin-bottom:6px;">
        <div style="flex:0 0 70px;font-weight:600;">${$t('{n}. sıra', { n: i + 1 })}</div>
        <input class="num ab-input" data-i="${i}" value="${values[i]}" placeholder="tutar">
      </div>`);
      tableEl.appendChild(row);
    }
    tableCard.querySelector('#ab-save-table').onclick = async () => {
      const inputs = tableCard.querySelectorAll('.ab-input');
      const table = [];
      inputs.forEach(inp => { table[parseInt(inp.dataset.i)] = parseAmount(inp.value) || 0; });
      lg.adminBonusTable = table;
      await persist();
      toast('Bonus tablosu kaydedildi.');
    };

    const entryCard = el(`
      <div class="card">
        <h2>Haftalık sıralama gir</h2>
        <div class="sub">Takımları 1.'den sona doğru sürükleyerek sırala, sonra kaydet.</div>
        <div class="field"><label>Etiket (opsiyonel, örn. "3. hafta")</label><input id="ab-label" placeholder="opsiyonel"></div>
        <ul class="rank-list" id="rank-list"></ul>
        <button class="primary" id="ab-add">Bu Sıralamayı Kaydet</button>
      </div>
    `);
    wrap.appendChild(entryCard);
    const rankList = entryCard.querySelector('#rank-list');
    let order = lg.teams.slice();
    function renderRankList(){
      rankList.innerHTML = '';
      order.forEach((t, i) => {
        const li = el(`<li draggable="true" data-i="${i}"><span class="n">${i+1}</span><span style="flex:1;">${escapeHtml(t)}</span><span class="muted small">${lg.adminBonusTable[i]!=null?fmt(lg.adminBonusTable[i])+' €':''}</span></li>`);
        li.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', i); });
        li.addEventListener('dragover', (e) => e.preventDefault());
        li.addEventListener('drop', (e) => {
          e.preventDefault();
          const from = parseInt(e.dataTransfer.getData('text/plain'));
          const to = i;
          const [moved] = order.splice(from, 1);
          order.splice(to, 0, moved);
          renderRankList();
        });
        rankList.appendChild(li);
      });
    }
    renderRankList();
    entryCard.querySelector('#ab-add').onclick = async () => {
      const label = entryCard.querySelector('#ab-label').value.trim();
      lg.adminBonusLog = lg.adminBonusLog || [];
      lg.adminBonusLog.push({ id: uid(), ranking: order.slice(), label, addedAt: nowIso() });
      await persist();
      toast('Haftalık sıralama kaydedildi.');
    };

    const logCard = el(`<div class="card"><h2>Geçmiş sıralamalar</h2><div id="ab-log"></div></div>`);
    wrap.appendChild(logCard);
    const logEl = logCard.querySelector('#ab-log');
    const sorted = (lg.adminBonusLog||[]).slice().sort((a,b)=>(b.addedAt||'').localeCompare(a.addedAt||''));
    if (!sorted.length) logEl.appendChild(el(`<div class="empty">Henüz sıralama girilmedi.</div>`));
    else sorted.forEach(entry => {
      const row = el(`<div class="card" style="background:var(--surface-2);margin-bottom:10px;">
        <div class="row" style="align-items:center;">
          <div style="flex:1;font-weight:600;">${entry.label ? escapeHtml(entry.label) : new Date(entry.addedAt).toLocaleDateString(LOC())}</div>
          <button class="icon-btn" title="Sil">✕</button>
        </div>
        <div class="small muted" style="margin-top:6px;">${entry.ranking.map((t,i)=>`${i+1}. ${escapeHtml(t)}`).join(' · ')}</div>
      </div>`);
      row.querySelector('button').onclick = async () => {
        const ok = await showConfirm('Bu sıralama kaydını silmek istediğine emin misin?');
        if (!ok) return;
        lg.adminBonusLog = lg.adminBonusLog.filter(x => x.id !== entry.id);
        await persist();
      };
      logEl.appendChild(row);
    });
  }
  return wrap;
}

    const shotCard = el(`
      <div class="card">
        <h2>Kadro değerlerini ekran görüntüsüyle güncelle</h2>

    `);

  }
  const card = el(`
    <div class="card">
      <h2>Kadro (piyasa) değerleri</h2>
      <div class="sub">Her takımın güncel kadro değerini gir — maksimum teklif hesaplaması bu değeri kullanır.</div>
      <div id="squad-rows"></div>

  if (!lg.teams.length) { rows.appendChild(el(`<div class="empty">Önce Lig Kurulumu sekmesinden takım ekle.</div>`)); return wrap; }
  lg.teams.forEach(t => {
    const current = (lg.squadValues && lg.squadValues[t] && lg.squadValues[t].value) || '';
    const updated = (lg.squadValues && lg.squadValues[t] && lg.squadValues[t].updatedAt) ? new Date(lg.squadValues[t].updatedAt).toLocaleDateString(LOC()) : '—';
    const row = el(`<div class="row" style="align-items:center;margin-bottom:8px;">
      <div style="flex:1;font-weight:600;">${escapeHtml(t)}</div>
      <input class="num sq-input" data-team="${escapeHtml(t)}" value="${current}" placeholder="kadro değeri" style="flex:1;">
      <div class="small muted" style="flex:0 0 100px;">${$t('güncelleme: {d}', { d: updated })}</div>
    </div>`);
    rows.appendChild(row);
  });
  const saveBtn = el(`<button class="primary" style="margin-top:8px;">Tümünü Kaydet</button>`);
  card.appendChild(saveBtn);
  saveBtn.onclick = async () => {
    lg.squadValues = lg.squadValues || {};

      const v = parseAmount(inp.value);
      if (!isNaN(v)) lg.squadValues[inp.dataset.team] = { value: v, updatedAt: nowIso() };
    });
    await persist();
    toast('Kadro değerleri kaydedildi.');
  };

}

// ---------- DASHBOARD ----------
function renderDashboard(){
  const lg = state.current;
  const c = state.computed;
  const wrap = el(`<div></div>`);
  if (!lg.teams.length) { wrap.appendChild(el(`<div class="card"><div class="empty">Önce Lig Kurulumu sekmesinden takım ekle.</div></div>`)); return wrap; }

  const summary = el(`
    <div class="card">
      <h2>Takım karşılaştırma</h2>
      <div class="sub">Güncel bütçe, kadro değeri ve maksimum teklif kapasitesi</div>
      <div style="overflow-x:auto;">
        <table class="data" id="dash-table">
          <thead><tr><th>Takım</th><th class="amt">Bütçe</th><th class="amt">Kadro Değeri</th><th class="amt">Maks. Teklif <span class="warn-mark" title="Kadro değerleri güncel değilse bu hesap yanlış olur">⚠</span></th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  `);
  wrap.appendChild(summary);
  const tbody = summary.querySelector('tbody');
  const sqDate = t => { const u = lg.squadValues && lg.squadValues[t] && lg.squadValues[t].updatedAt; return u ? new Date(u).toLocaleString(LOC(), { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''; };
  const rows = lg.teams.map(t => ({ t, budget: c.budgets[t]||0, squad: c.squadValues[t]||0, max: c.maxBid[t]||0, updated: sqDate(t) }))
    .sort((a,b) => b.max - a.max);
  rows.forEach(r => {
    const negative = r.budget < 0;
    const tr = el(`<tr>
      <td>${escapeHtml(r.t)}</td>
      <td class="amt num ${negative?'neg':''}">${fmt(r.budget)}</td>
      <td class="amt num">${r.squad ? fmt(r.squad) : '<span class="neg small">girilmemiş</span>'}${r.updated ? `<div class="small muted">${r.updated}</div>` : ''}</td>
      <td class="amt num" style="font-weight:700;">${fmt(r.max)}</td>
      <td>${negative ? '<span class="pill warn">EKSİ BÜTÇE</span>' : ''}</td>
    </tr>`);
    tr.style.cursor = 'pointer';
    tr.onclick = () => openTeamDetail(r.t);
    tbody.appendChild(tr);
  });

  if (lg.negativeBudgetRule > 0) {
    const stamps = lg.teams.map(t => lg.squadValues && lg.squadValues[t] && lg.squadValues[t].updatedAt).filter(Boolean).sort();
    const missing = lg.teams.filter(t => !(lg.squadValues && lg.squadValues[t] && lg.squadValues[t].value));
    const oldest = stamps.length ? new Date(stamps[0]).toLocaleString(LOC(), { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : null;
    const card = el(`<div class="card warn-card">
      <strong>⚠ Maks. teklif kadro değerine bağlı:</strong> Maksimum teklif = mevcut bütçe + kadro değerinin %25'i (takımın eksiye düşebileceği en fazla tutar). Yani sisteme işlenmiş kadro değeri doğrudan hesaba girer. Kadro değerleri oyunda sürekli değiştiği için en güncel değerler işlenmezse maksimum teklif yanlış hesaplanır.
      <div class="small" style="margin-top:6px;">${missing.length ? $t('Kadro değeri girilmemiş takım: <strong>{names}</strong>.', { names: missing.map(escapeHtml).join(', ') }) + ' ' : ''}${oldest ? $t('En eski güncelleme: <strong>{d}</strong>.', { d: oldest }) : ''}</div>
      <button class="go-squad" style="margin-top:10px;">Kadro değerlerini güncelle</button>
    </div>`);
    card.querySelector('.go-squad').onclick = () => { state.tab = 'kadro'; render(); };
    wrap.appendChild(card);
  }

  if (lg.zeroPointsIfNegative && rows.some(r => r.budget < 0)) {
    wrap.appendChild(el(`<div class="card" style="border-color:var(--danger);background:var(--danger-bg);">
      <strong style="color:var(--danger);">⚠ Uyarı:</strong> Eksi bütçedeki takım(lar), haftanın ilk maçı başladığında bütçe hâlâ eksideyse o hafta 0 puan alma riskiyle karşı karşıya.
    </div>`));
  }

  const exportCard = el(`<div class="card"><h2>Dışa Aktar</h2><div class="sub">Tüm bütçe hareketlerini CSV olarak indir.</div><button id="export-csv" ${downloadsCap?'':'disabled'}>${downloadsCap?'CSV İndir':'İndirme desteklenmiyor'}</button></div>`);
  wrap.appendChild(exportCard);
  const exportBtn = exportCard.querySelector('#export-csv');
  if (downloadsCap) exportBtn.onclick = async () => {
    let csv = 'Takim,Kategori,Aciklama,Tutar,CalismaBakiyesi\n';
    lg.teams.forEach(t => {
      (c.ledger[t]||[]).forEach(e => {
        csv += `"${t}","${e.type}","${(e.label||'').replace(/"/g,'""')}",${e.amount},${e.runningBalance}\n`;
      });
    });
    try {
      await downloadsCap.save({ filename: `${lg.name.replace(/[^a-z0-9]+/gi,'_')}_butce.csv`, data: '\ufeff' + csv });
    } catch(e){ toast('İndirme iptal edildi veya başarısız.'); }
  };

  return wrap;
}

function openTeamDetail(team){
  const lg = state.current;
  const c = state.computed;
  const overlay = el(`<div class="overlay"></div>`);
  const entries = c.ledger[team] || [];
  const modal = el(`
    <div class="modal">
      <h3>${$t('{team} — Bütçe geçmişi', { team: escapeHtml(team) })}</h3>
      <div style="overflow-x:auto;">
        <table class="data">
          <thead><tr><th>Kalem</th><th class="amt">Etki</th><th class="amt">Bakiye</th></tr></thead>
          <tbody>
            ${entries.map(e => `<tr>
              <td>${escapeHtml(e.label)}</td>
              <td class="amt num ${e.amount<0?'neg':'pos'}">${e.amount>=0?'+':''}${fmt(e.amount)}</td>
              <td class="amt num" style="font-weight:600;">${fmt(e.runningBalance)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="row" style="margin-top:16px;">
        <div style="flex:1;"></div>
        <button id="close-detail" class="primary" style="flex:0 0 auto;">Kapat</button>
      </div>
    </div>
  `);
  modal.querySelector('#close-detail').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

boot();
})();
