<style>
  :root {

      --surface-2: #ECF1EA;
      --line: #D7E0D8;
      --text: #142219;
      --muted: #5C6E5E;
      --accent: #8E1B2E;
      --accent-dim: #D9A3AE;
      --brand: #8E1B2E;
      --brand-hover: #A6243A;
      --on-brand: #FFFFFF;
      --danger: #C23B27;
      --danger-bg: #FBE7E3;
      --positive: #2C8350;

  .name-note { border: 1px solid var(--accent-dim); background: color-mix(in srgb, var(--accent) 9%, transparent); border-radius: 9px; padding: 11px 13px; font-size: 13px; line-height: 1.55; margin-bottom: 14px; }

  .guide .formula { font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--accent); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; }

  .acct-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }

  .browser-tip { margin-top: 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 13px; font-size: 13px; line-height: 1.55; }

<script>
(function(){
"use strict";

// ---------- utils ----------
function fmt(n){
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  return (neg?'-':'') + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'en' ? ',' : '.');
}
function parseAmount(str){
  if (typeof str === 'number') return Math.round(str);
  if (!str) return NaN;
  const cleaned = String(str).replace(/[^\d-]/g, '');
  if (!cleaned) return NaN;
  return parseInt(cleaned, 10);
}
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function nowIso(){ return new Date().toISOString(); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t = el(`<div class="toast">${escapeHtml(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}

// ---------- capabilities ----------
let db = null, sampleFn = null, downloadsCap = null, imgLimits = null, userCap = null, isOwner = false;
// ---------- i18n ----------
let LANG = (() => {
  try { const v = localStorage.getItem('cetele_lang'); if (['tr','en','de'].includes(v)) return v; } catch(e){}
  const n = (navigator.language || 'tr').slice(0, 2).toLowerCase();
  return n === 'de' ? 'de' : n === 'tr' ? 'tr' : 'en';
})();
const LOCALES = { tr: 'tr-TR', en: 'en-GB', de: 'de-DE' };
const LOC = () => LOCALES[LANG];
const I18N = { en: {}, de: {} };
// Translate a Turkish source string (optionally with {placeholders})
const I18N_KEYS = { tr: {} };
function $t(src, vars){
  let s = src.charAt(0) === '@'
    ? ((LANG !== 'tr' && I18N[LANG][src]) || I18N_KEYS.tr[src] || src)
    : (LANG === 'tr' ? src : (I18N[LANG][src] ?? src));
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] ?? m));

function loadScript(src){
  return new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = src; sc.async = false;
    const t = setTimeout(() => reject(new Error('timeout')), 15000);
    sc.onload = () => { clearTimeout(t); resolve(); };
    sc.onerror = () => { clearTimeout(t); reject(new Error('load failed')); };
    document.head.appendChild(sc);
  });
}

function makeCloudDb(fs, uid){
  const base = fs.collection('users').doc(uid);
  const clean = b => JSON.parse(JSON.stringify(b));
  return {
    doc(path){
      const [col, id] = path.split('/');
      const ref = base.collection(col).doc(id);
      return {
        get: async () => { const sn = await ref.get(); return { id, exists: sn.exists, data: () => sn.exists ? sn.data() : undefined }; },
        // not awaited: the local cache applies the write at once, the server catches up (also offline)
        set: async (body) => { ref.set(clean(body)).catch(e => { console.error(e); toast(cloudErrorText(e)); }); },
        delete: async () => { ref.delete().catch(e => { console.error(e); toast(cloudErrorText(e)); }); }
      };
    },
    collection(col){
      return { get: async () => {
        const q = await base.collection(col).get();
        const docs = q.docs.map(d => ({ id: d.id, exists: true, data: () => d.data() }));
        return { docs, size: docs.length, empty: !docs.length };
      } };
    }
  };
}

    toast('Bulut bağlantısı kurulamadı, bu cihazdaki verilerle devam ediliyor.');
    return;
  }
  firebase.auth().onAuthStateChanged(async (user) => {
    cloud.user = user || null;
    state.current = null;
    if (user) {
      setGuest(false);
      isCloud = true;
      db = makeCloudDb(cloud.fs, user.uid);
      state.screen = 'app';
      try { await loadAndRender(); }
      catch(e){ console.error(e); toast(cloudErrorText(e)); state.leagues = []; recompute(); render(); }

    }
  });
}

function makeLocalDb(){
  const KEY = 'cetele_data_v1';
  localStorage.setItem('cetele_probe', '1'); localStorage.removeItem('cetele_probe');
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ return {}; } };
  const write = (o) => localStorage.setItem(KEY, JSON.stringify(o));
  const snap = (id, d) => ({ id, exists: d !== undefined, data: () => d === undefined ? undefined : JSON.parse(JSON.stringify(d)) });
  return {
    doc(path){
      const [col, id] = path.split('/');
      return {
        get: async () => snap(id, (read()[col] || {})[id]),
        set: async (body) => { const o = read(); o[col] = o[col] || {}; o[col][id] = JSON.parse(JSON.stringify(body)); write(o); },
        delete: async () => { const o = read(); if (o[col]) delete o[col][id]; write(o); }
      };
    },
    collection(col){
      return { get: async () => { const docs = Object.entries(read()[col] || {}).map(([id, d]) => snap(id, d)); return { docs, size: docs.length, empty: !docs.length }; } };
    }
  };
}

// ---------- default league shape ----------
function newLeague(name){
  return {
    name: name || $t('Yeni Lig'),
    createdAt: nowIso(),
    teams: [],
    marketName: 'Computer',
    startingBudget: 100000000,
    negativeBudgetRule: 0.25, // 0.25 or 0
    zeroPointsIfNegative: true,
    pointBonusPerPoint: 10000,
    adminBonusEnabled: false,
    adminBonusTable: [],
    transfers: [],       // {id, player, amount, from, to, addedAt}
    squadValues: {},     // team -> {value, updatedAt}
    pointsLog: [],        // {id, team, mode:'weekly'|'cumulative', value, addedAt, label}
    adminBonusLog: []     // {id, ranking:[team...], label, addedAt}
  };
}

// ---------- calculation engine ----------
// Team names are matched ignoring case and extra spaces ("kara  kartal" = "Kara Kartal")
function canonName(lg, name){
  const n = normName(name);
  if (!n) return null;
  const t = (lg.teams || []).find(x => normName(x) === n);
  if (t) return t;
  const m = lg.marketName || 'Computer';
  return normName(m) === n ? m : null;
}
function unknownTransferNames(lg){
  const counts = new Map();
  (lg.transfers || []).forEach(tr => [tr.from, tr.to].forEach(nm => {
    if (canonName(lg, nm) === null) { const k = String(nm).trim(); counts.set(k, (counts.get(k) || 0) + 1); }
  }));
  return counts;
}
function computeLeague(lg){
  const teams = lg.teams || [];
  const ledger = {}; teams.forEach(t => ledger[t] = []);
  teams.forEach(t => ledger[t].push({ type: 'baslangic', label: $t('Başlangıç bütçesi'), amount: lg.startingBudget }));

  (lg.transfers || []).forEach(tr => {
    const to = canonName(lg, tr.to), from = canonName(lg, tr.from);
    if (to && ledger[to]) {
      ledger[to].push({ type: 'alis', label: $t('{player} ({from} tarafından alış)', { player: tr.player, from: tr.from }), amount: -Math.abs(tr.amount) });
    }
    if (from && ledger[from]) {
      ledger[from].push({ type: 'satis', label: $t('{player} ({to} tarafına satış)', { player: tr.player, to: tr.to }), amount: Math.abs(tr.amount) });
    }
  });

  // points, per team, processed in chronological order
  const cumByTeam = {};
  (lg.pointsLog || []).slice().sort((a,b)=> (a.addedAt||'').localeCompare(b.addedAt||'')).forEach(p => {
    if (!teams.includes(p.team)) return;
    const prior = cumByTeam[p.team] || 0;
    let credited, newCum;
    if (p.mode === 'cumulative') {
      credited = p.value - prior;
      newCum = p.value;
    } else {
      credited = p.value;
      newCum = prior + p.value;
    }
    cumByTeam[p.team] = newCum;
    const bonus = credited * (lg.pointBonusPerPoint || 10000);
    ledger[p.team].push({
      type: 'puan',
      label: $t('Puan bonusu — {label}{v} puan ({mode})', { label: p.label ? p.label + ' — ' : '', v: p.value, mode: p.mode === 'cumulative' ? $t('toplam') : $t('bu hafta') }),
      amount: bonus
    });
  });

  if (lg.adminBonusEnabled) {
    (lg.adminBonusLog || []).forEach(entry => {
      (entry.ranking || []).forEach((team, idx) => {
        if (!teams.includes(team)) return;
        const amt = (lg.adminBonusTable || [])[idx];
        if (amt == null) return;
        ledger[team].push({ type: 'admin', label: $t('Sıralama bonusu{label} ({n}. sıra)', { label: entry.label ? ' — ' + entry.label : '', n: idx + 1 }), amount: amt });
      });
    });
  }

  const budgets = {};
  teams.forEach(t => {
    let running = 0;
    ledger[t].forEach(e => { running += e.amount; e.runningBalance = running; });
    budgets[t] = running;
  });

  const squadValues = {};
  teams.forEach(t => { squadValues[t] = (lg.squadValues && lg.squadValues[t] && lg.squadValues[t].value) || 0; });

  const maxBid = {};
  teams.forEach(t => { maxBid[t] = budgets[t] + squadValues[t] * (lg.negativeBudgetRule || 0); });

  return { ledger, budgets, squadValues, maxBid };
}

function showPrompt(message, defaultValue){
  return new Promise((resolve) => {
    const overlay = el(`<div class="overlay"></div>`);
    const modal = el(`
      <div class="modal" style="max-width:420px;">
        <h3>${escapeHtml(message)}</h3>
        <div class="field"><input id="prompt-input" value="${escapeHtml(defaultValue||'')}"></div>
        <div class="row">
          <button id="prompt-cancel" style="flex:1;">Vazgeç</button>
          <button id="prompt-ok" class="primary" style="flex:1;">Tamam</button>
        </div>
      </div>
    `);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    const input = modal.querySelector('#prompt-input');
    input.focus(); input.select();
    function done(val){ overlay.remove(); resolve(val); }
    modal.querySelector('#prompt-cancel').onclick = () => done(null);
    modal.querySelector('#prompt-ok').onclick = () => done(input.value.trim() || null);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') done(input.value.trim() || null); if (e.key === 'Escape') done(null); });
    overlay.onclick = (e) => { if (e.target === overlay) done(null); };
  });
}
function showConfirm(message, yesLabel, danger){
  return new Promise((resolve) => {
    const overlay = el(`<div class="overlay"></div>`);
    const modal = el(`
      <div class="modal" style="max-width:420px;">
        <h3>${escapeHtml(message)}</h3>
        <div class="row">
          <button id="confirm-no" style="flex:1;">Vazgeç</button>
          <button id="confirm-yes" class="${danger === false ? 'primary' : 'danger'}" style="flex:1;">${escapeHtml(yesLabel || 'Evet, Sil')}</button>
        </div>
      </div>
    `);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    function done(val){ overlay.remove(); resolve(val); }
    modal.querySelector('#confirm-no').onclick = () => done(false);
    modal.querySelector('#confirm-yes').onclick = () => done(true);
    overlay.onclick = (e) => { if (e.target === overlay) done(false); };
  });
}

function filesFromClipboard(cd){
  const out = [];
  if (!cd) return out;
  if (cd.files && cd.files.length) for (const f of cd.files) if (f.type && f.type.startsWith('image/')) out.push(f);
  if (!out.length && cd.items) for (const it of cd.items) {
    if (it.kind === 'file' && it.type.startsWith('image/')) { const f = it.getAsFile(); if (f) out.push(f); }
  }

function dataUrlToBlob(u){
  const [h, b] = u.split(',');
  const mime = (h.match(/data:([^;]+)/) || [])[1] || 'image/png';
  const bin = atob(b);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

    <div class="row"><button class="pick" style="flex:0 0 auto;">📷 Dosyadan seç</button></div>
    <input type="file" accept="image/*" multiple style="display:none;">
  </div>`);
  const zone = box.querySelector('.paste-zone');
  const input = box.querySelector('input[type=file]');
  zone.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) && e.key.length === 1) e.preventDefault();
  });
  zone.addEventListener('paste', e => {
    const files = filesFromClipboard(e.clipboardData);
    e.preventDefault();
    zone.innerHTML = '';
    if (files.length) onFiles(files);
    else toast('Panoda görsel bulunamadı. Önce ekran görüntüsünü kopyala.');
  });
  // Some mobile browsers insert the image directly instead of firing a paste with files
  zone.addEventListener('input', async () => {
    const img = zone.querySelector('img');
    const src = img && img.getAttribute('src');
    zone.innerHTML = '';
    if (!src) return;
    try {
      const blob = src.startsWith('data:') ? dataUrlToBlob(src) : await (await fetch(src)).blob();
      if (blob && blob.type.startsWith('image/')) onFiles([new File([blob], 'yapistirilan.png', { type: blob.type })]);
    } catch(err) { toast('Yapıştırılan görsel okunamadı, "Dosyadan seç" ile dene.'); }
  });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('drag');
    const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []).filter(f => f.type.startsWith('image/'));
    if (files.length) onFiles(files); else toast('Bırakılan dosya bir görsel değil.');
  });
  box.querySelector('.pick').onclick = () => input.click();
  input.onchange = () => { const files = Array.from(input.files || []); input.value = ''; if (files.length) onFiles(files); };
  return box;
}
// Paste anywhere on the page (outside the paste zone) also works on the relevant tabs
function onGlobalPaste(e){
  if (e.defaultPrevented || !state.current || !sampleFn) return;
  if (document.querySelector('.overlay')) return;
  const files = filesFromClipboard(e.clipboardData);
  if (!files.length) return;
  if (state.tab === 'transferler') { e.preventDefault(); handleScreenshotUpload(files); }
  else if (state.tab === 'puanlar') { e.preventDefault(); handleStandingsScreenshot(files, 'points'); }
  else if (state.tab === 'kadro') { e.preventDefault(); handleStandingsScreenshot(files, 'squad'); }
}

async function openFeedbackModal(){
  let uidv = null;
  if (cloud.available) {
    if (!cloud.user) { toast('Geri bildirim göndermek için giriş yap.'); return; }
  } else {
    uidv = userCap ? await userCap.id().catch(() => null) : null;
    if (!uidv) { toast('Geri bildirim bu görünümde gönderilemiyor.'); return; }
  }
  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal" style="max-width:480px;">
      <h3>Geri bildirim gönder</h3>
      <p class="fb-quote">"İletişimsizlikten doğan varsayım, insanı hiç yaşanmamış kavgaların içine sokar."</p>
      <p class="sub" style="margin-top:0;">Bir şikayetin, önerin ya da aklına takılan bir şey varsa bizimle iletişime geçebilirsin.</p>
      <div class="field"><label>Konu</label>
        <select id="fb-cat"><option value="hata">Hata bildirimi</option><option value="oneri">Öneri / yeni özellik</option><option value="diger">Diğer</option></select>
      </div>
      <div class="field"><label>Mesaj</label><textarea id="fb-text" rows="5" maxlength="2000" placeholder="Neyi yapamıyorsun? Neyi yapabilmek isterdin?"></textarea></div>
      <div class="row">
        <button id="fb-cancel" style="flex:1;">Vazgeç</button>
        <button id="fb-send" class="primary" style="flex:1;">Gönder</button>
      </div>
    </div>`);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  modal.querySelector('#fb-text').focus();
  modal.querySelector('#fb-cancel').onclick = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  modal.querySelector('#fb-send').onclick = async () => {
    const text = modal.querySelector('#fb-text').value.trim();
    if (!text) { toast('Mesaj boş olamaz.'); return; }
    const btn = modal.querySelector('#fb-send');
    btn.disabled = true;
    if (cloud.available) {
      cloud.fs.collection('feedback').add({
        uid: cloud.user.uid,
        email: cloud.user.email || '',
        cat: modal.querySelector('#fb-cat').value,
        text: text.slice(0, 2000),
        league: state.current ? state.current.name : '',
        at: nowIso(),
        device: navigator.userAgent.slice(0, 200)
      }).catch(e => { console.error(e); toast(e && e.code === 'permission-denied' ? 'Geri bildirim gönderilemedi: Firestore kuralları güncel değil.' : 'Geri bildirim gönderilemedi, tekrar dene.'); });
      overlay.remove();
      toast('Geri bildirimin gönderildi, teşekkürler.');
      return;
    }
    try {
      const ref = db.doc('feedback/' + uidv);
      const snap = await ref.get();
      const prev = snap.exists ? (snap.data().messages || []) : [];
      const messages = prev.concat([{ id: uid(), cat: modal.querySelector('#fb-cat').value, text: text.slice(0, 2000), at: nowIso(), league: state.current ? state.current.name : '' }]).slice(-100);
      await ref.set({ messages, updatedAt: nowIso() });
      overlay.remove();
      toast('Geri bildirimin gönderildi, teşekkürler.');
    } catch(e) {
      console.error(e);
      btn.disabled = false;
      toast('Gönderilemedi, tekrar dene.');
    }
  };
}

function renderInbox(){
  const wrap = el(`<div class="card"><h2>Gelen geri bildirimler</h2><div class="sub">Bu sekmeyi sadece sen görüyorsun.</div><div class="ib"><div class="empty">Yükleniyor…</div></div></div>`);
  const host = wrap.querySelector('.ib');
  (async () => {
    try {
      const snap = await db.collection('feedback').get();
      const items = [];
      snap.docs.forEach(d => (d.data().messages || []).forEach(m => items.push({ ...m, sender: d.id })));
      items.sort((a, b) => (b.at || '').localeCompare(a.at || ''));
      host.innerHTML = '';
      if (!items.length) { host.appendChild(el(`<div class="empty">Henüz geri bildirim yok.</div>`)); return; }
      let names = {};
      try { names = await userCap.profiles([...new Set(items.map(i => i.sender))]); } catch(e) {}
      const catLabel = { hata: 'Hata', oneri: 'Öneri', diger: 'Diğer' };
      items.forEach(m => {
        const who = (names[m.sender] && names[m.sender].name) || 'Bir kullanıcı';
        const when = m.at ? new Date(m.at).toLocaleString(LOC(), { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
        const row = el(`<div class="fb-item">
          <div class="fb-head"><span class="pill ${m.cat === 'hata' ? 'warn' : 'ok'}">${catLabel[m.cat] || 'Diğer'}</span>
            <span class="small"></span><span class="small muted">${when}${m.league ? $t(', lig: {name}', { name: escapeHtml(m.league) }) : ''}</span></div>
          <div class="fb-text"></div>
        </div>`);
        row.querySelector('.fb-head .small').textContent = who;
        row.querySelector('.fb-text').textContent = m.text;
        host.appendChild(row);
      });
    } catch(e) {
      console.error(e);
      host.innerHTML = '';
      host.appendChild(el(`<div class="empty">Geri bildirimler yüklenemedi.</div>`));
    }
  })();
  return wrap;
}

};

  state.computed = state.current ? computeLeague(state.current) : null;
}

// ---------- render shell ----------
const TABS = [
  { id: 'kurulum', label: 'Lig Kurulumu' },
  { id: 'dashboard', label: 'Dashboard' },
  { id: 'kadro', label: 'Kadro Değerleri' },
  { id: 'transferler', label: 'Transferler' },

];

async function boot(){
  applyLangMeta();
  startTranslator();
  await initCaps();
  document.addEventListener('paste', onGlobalPaste);
  if (isLocal && location.protocol !== 'file:') { await startCloud(); return; }
  await loadAndRender();
}

function render(){
  closeMenu();
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (state.screen === 'login') { app.appendChild(renderLogin()); return; }
  app.appendChild(renderNav());

  main.appendChild(renderTab());
  app.appendChild(main);
}

function renderNav(){
  const nav = document.createElement('nav');
  nav.id = 'tabs';
  const leagueSelectHtml = `
    <select id="league-select" ${!db ? 'disabled' : ''}>
      ${state.leagues.length === 0 ? '<option>Lig yok</option>' : state.leagues.map(l => `<option value="${l.id}" ${state.current && state.current.id===l.id ? 'selected' : ''}>${escapeHtml(l.name)}</option>`).join('')}
    </select>`;
  nav.innerHTML = `
    <div class="brand">${BRAND_SVG}ÇETELE</div>
    <div style="padding:0 8px 14px;">${langSwitchHtml()}</div>
    <div class="field">
      <label>Aktif lig</label>
      ${leagueSelectHtml}
    </div>
    <div class="row" style="margin-bottom:16px;">
      <button id="new-league-btn" style="flex:1;">+ Yeni Lig</button>
    </div>
    <div id="tablist">
      ${state.current ? TABS.map(t => `<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('') : ''}
      ${isOwner ? `<button class="tab ${state.tab==='inbox'?'active':''}" data-tab="inbox">Gelen geri bildirimler</button>` : ''}
      <button class="tab guide-tab ${state.tab==='kilavuz'?'active':''}" data-tab="kilavuz">📖 Kullanma Kılavuzu</button>
    </div>
    ${cloud.available ? (cloud.user
      ? `<div class="nav-foot"><div class="small muted">Hesabın</div><div class="small acct"></div><button id="acct-btn" class="ghost small" style="padding-left:0;color:var(--muted);display:block;">⚙ Hesap ayarları</button><button id="logout-btn" class="ghost small" style="padding-left:0;color:var(--muted);">Çıkış yap</button></div>`
      : `<div class="nav-foot"><div class="small muted" style="margin-bottom:6px;">Kayıtlar sadece bu cihazda</div><button id="login-btn" style="width:100%;">Giriş yap / üye ol</button></div>`) : ''}
    ${(db && userCap) || cloud.available ? `<div class="nav-foot"><button id="feedback-btn" class="ghost" style="width:100%;text-align:left;color:var(--muted);">✉ Geri bildirim gönder</button></div>` : ''}
  `;
  nav.querySelector('#new-league-btn').onclick = onNewLeague;
  wireLangSwitch(nav);
  const ab = nav.querySelector('#acct-btn');
  if (ab) ab.onclick = openAccountModal;
  const acct = nav.querySelector('.acct');
  if (acct && cloud.user) acct.textContent = cloud.user.email || cloud.user.displayName || 'Hesabın';
  const lo = nav.querySelector('#logout-btn');
  if (lo) lo.onclick = async () => {
    const ok = await showConfirm('Hesabından çıkış yapılsın mı? Kayıtların hesabında saklanmaya devam eder.', 'Çıkış yap', false);
    if (ok) { setGuest(false); firebase.auth().signOut(); }
  };
  const li = nav.querySelector('#login-btn');
  if (li) li.onclick = () => { setGuest(false); state.screen = 'login'; render(); };
  const fbBtn = nav.querySelector('#feedback-btn');
  if (fbBtn) fbBtn.onclick = openFeedbackModal;
  const sel = nav.querySelector('#league-select');
  if (sel) sel.onchange = async (e) => {
    const id = e.target.value;
    state.current = await loadLeague(id);
    setLastLeagueId(id);
    state.tab = 'kurulum';
    recompute(); render();
  };
  nav.querySelectorAll('button.tab').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });
  return nav;
}

async function onNewLeague(){
  const name = await showPrompt('Yeni lig adı:');
  if (!name) return;
  const lg = await createLeague(name.trim());
  if (!lg) return;
  state.leagues = await listLeagues();
  state.current = lg;
  setLastLeagueId(lg.id);
  state.tab = 'kurulum';
  recompute(); render();
  toast('Lig oluşturuldu. Şimdi takımları ekle.');
}

function renderTab(){
  if (state.tab === 'kilavuz') return renderGuide();
  if (!db) return el(`<div class="card"><h2>Depolama kullanılamıyor</h2><p class="sub">Tarayıcı veri saklamaya izin vermiyor. Gizli/özel sekmede açtıysan normal bir sekmede açmayı dene.</p></div>`);
  if (state.tab === 'inbox' && isOwner) return renderInbox();
  if (!state.current) {
    return el(`<div class="card"><h2>Başlamak için bir lig oluştur</h2><p class="sub">Soldaki "+ Yeni Lig" butonuna tıkla, lig adını gir ve Lig Kurulumu sekmesinden takımlarını tanımla.</p></div>`);
  }
  switch(state.tab){
    case 'kurulum': return renderKurulum();
    case 'transferler': return renderTransferler();
    case 'puanlar': return renderPuanlar();
    case 'siralama': return renderSiralama();
    case 'kadro': return renderKadro();
    case 'dashboard': return renderDashboard();
    default: return document.createElement('div');
  }
}


const GUIDE_HTML = {"en": "<h1>ÇETELE User Guide</h1>\n<p class=\"lead\">ÇETELE lets you track your rivals' budgets in your Comunio league and see how much each of them can bid for a player at most. Your records belong to you alone — nobody else can see them, including the other players in your league.</p>\n\n<h2>1. Getting started</h2>\n<p><strong>Sign in.</strong> Use your Google account or an email and password. That way your records are the same on your phone and your computer. You can also use the app without signing in, but then your records stay on that one device.</p>\n<p class=\"note\">If Google sign-in fails on your phone, <strong>sign up or sign in with your email</strong>. If you already have a Google-based account: first sign in with Google on your computer, create a <strong>ÇETELE password</strong> under <strong>Account settings</strong> in the left menu, then sign in on your phone with your Gmail address and that password. The ÇETELE password is separate from your Gmail password and doesn't affect your Gmail account. Once you've signed in on a device, you won't be asked for a password again until you sign out.</p>\n<h3>Using it on your phone</h3>\n<ul>\n<li><strong>iPhone:</strong> Open it in Safari. Tap <strong>Share</strong> at the bottom → <strong>Add to Home Screen</strong> to use it like an app. Google sign-in may fail on iPhone; in that case sign in with your email address and ÇETELE password.</li>\n<li><strong>Android:</strong> Open it in Chrome. Tap <strong>⋮</strong> at the top right → <strong>Add to Home screen</strong>. Google sign-in usually works fine.</li>\n<li><strong>Huawei phones and tablets:</strong> On Huawei devices without Google services, use Firefox and sign in with your email address and ÇETELE password. Make sure \"Delete browsing data on quit\" is off in Firefox's settings, otherwise you'll be signed out every time you close it.</li>\n<li>If you added it to your home screen, always open it from there.</li>\n</ul>\n<p><strong>Create your league.</strong> Tap <strong>+ New league</strong> in the left menu and give it a name.</p>\n<p><strong>Fill in League Setup:</strong></p>\n<ul>\n<li><strong>Teams:</strong> Add every team in the league, including your own. Copy and paste the names from Comunio. If a name is spelled differently from the game, that team's transfers won't count towards its budget.</li>\n<li><strong>Market account name:</strong> The name of the computer account shown in the game's transfer news (usually \"Computer\").</li>\n<li><strong>Starting budget:</strong> The budget everyone gets at the start of the season.</li>\n<li><strong>Negative budget rule:</strong> Choose the first option if teams in your league can go into the red up to 25% of their squad value, or the other one if they can't go negative at all.</li>\n</ul>\n\n<h2>2. Starting mid-season: enter the history</h2>\n<p>For the budgets to be correct, everything since the start of the season needs to be entered. This is a one-off job — after that you only add new activity.</p>\n<ol>\n<li><strong>Transfers:</strong> Copy and paste all the transfer news from Comunio. A single missing transfer makes that team's budget wrong.</li>\n<li><strong>Points Bonus:</strong> Enter each week's points. If you only know the current total points, you can enter them in one go with the \"Total points\" option.</li>\n<li><strong>Ranking Bonus:</strong> If your league admin pays a weekly bonus, enter the bonus table and the rankings of past weeks.</li>\n<li><strong>Squad Values:</strong> Enter every team's current squad value.</li>\n</ol>\n<p class=\"note\"><strong>Check it:</strong> Look at your own team's budget on the Dashboard and compare it with your budget in the game. If they match, your records are correct. If they don't, a transfer, points entry or bonus is missing or was entered twice. This is also the best check in the weeks that follow.</p>\n\n<h2>3. Weekly routine</h2>\n<ul>\n<li><strong>As transfers happen:</strong> Paste the new transfer news.</li>\n<li><strong>When the week ends:</strong> Enter the week's points and, if your league uses it, the ranking bonus.</li>\n<li><strong>Before you bid:</strong> Update the squad values, then check your rivals' maximum bids on the Dashboard.</li>\n</ul>\n\n<h2>4. Tabs</h2>\n<h3>Dashboard</h3>\n<p>Every team's current budget, squad value and maximum bid. Tap a team to see all its budget movements since the start of the season. Warnings for teams in the red and outdated squad values appear here. You can also download all movements as a file that opens in Excel.</p>\n<h3>Squad Values</h3>\n<p>Enter the teams' squad values. They change all the time in the game, so make a habit of updating them before you bid.</p>\n<h3>Transfers</h3>\n<p>Paste the text and tap <strong>Read text</strong>. A preview table appears before anything is saved — check the numbers and fix them if needed. A transfer that was already entered is marked as a \"possible duplicate\" and isn't saved. The transfer text can be in Turkish, English or German.</p>\n<ul>\n<li>Tap the column headers to sort and filter the table, just like in Excel.</li>\n<li>Pick one of the team buttons at the top to list all of that team's purchases and sales, with the total fee.</li>\n<li>If a name that isn't in your team list shows up, a warning appears at the top where you can link it to the right team.</li>\n</ul>\n<h3>Points Bonus</h3>\n<p>The game adds 10,000 to the budget for every point. Enter all teams' points in the table. With \"This week's points\" the points are added to the total. With \"Total points\" only the difference from the previous entry is counted, so nothing is counted twice.</p>\n<h3>Ranking Bonus</h3>\n<p>This isn't a game rule. In some leagues the admin pays extra money based on the weekly ranking. If your league does this, turn this tab on, enter the bonus table and drag the teams into order every week.</p>\n<h3>League Setup</h3>\n<p>Add, rename (✎) and delete teams, set the league rules, make backups and delete the league.</p>\n\n<h2>5. How is the maximum bid calculated?</h2>\n<p class=\"formula\">Maximum bid = current budget + 25% of squad value</p>\n<p>Example: if a team has a budget of 5,000,000 and a squad value of 80,000,000, it can bid at most 5,000,000 + 20,000,000 = <strong>25,000,000</strong>. If your league uses the \"can't go negative at all\" rule, the maximum bid is simply the current budget.</p>\n<p><strong>Keep in mind:</strong></p>\n<ul>\n<li>If a rival sells a player <strong>to another team</strong>, the money arrives immediately and their maximum bid goes up at once. Sales to the Computer are processed the next day.</li>\n<li>If the squad values are out of date, the calculation will be wrong too.</li>\n</ul>\n\n<h2>6. Important reminders</h2>\n<ul>\n<li><strong>Negative budget:</strong> A team that's still in the red when the week's first match kicks off scores 0 points that week. Teams in the red are marked in red on the Dashboard.</li>\n<li><strong>Make backups:</strong> League Setup → Backup → <strong>Download backup</strong>. Especially before big changes.</li>\n<li><strong>Don't edit on two devices at the same time:</strong> The last save wins, and the change on the other device can be lost.</li>\n</ul>\n\n<h2>7. FAQ</h2>\n<h3>My budget on the Dashboard doesn't match the game.</h3>\n<p>A transfer may be missing or entered twice, or a week's points or bonus may be missing. In the Transfers tab, select your own team and compare the list with the news in the game.</p>\n<h3>I entered a wrong transfer.</h3>\n<p>Delete it with the ✕ at the end of its row in the Transfers table, then enter the correct one.</p>\n<h3>Can the other players in my league see my records?</h3>\n<p>No. Your records are stored only in your account.</p>\n<h3>A player renamed their team.</h3>\n<p>In League Setup, tap ✎ next to that team and type the new name. All past records switch to the new name.</p>\n<h3>The app doesn't ask for my password when it opens.</h3>\n<p>That's normal. Once you've signed in on a device, you stay signed in until you tap <strong>Sign out</strong> in the left menu.</p>\n<h3>Does the ÇETELE password change my Gmail password?</h3>\n<p>No. The ÇETELE password is only for signing in to this app. Your Gmail account and password aren't affected at all.</p>\n<h3>I found a bug or have an idea.</h3>\n<p>Tap <strong>Send feedback</strong> at the bottom of the left menu. Your message comes straight to us.</p>\n", "de": "<h1>ÇETELE-Anleitung</h1>\n<p class=\"lead\">Mit ÇETELE behältst du die Kontostände deiner Gegner in deiner Comunio-Liga im Blick und siehst, wie viel jeder von ihnen höchstens für einen Spieler bieten kann. Deine Einträge gehören nur dir — niemand sonst kann sie sehen, auch nicht die anderen Spieler deiner Liga.</p>\n\n<h2>1. Erste Schritte</h2>\n<p><strong>Melde dich an.</strong> Mit deinem Google-Konto oder mit E-Mail und Passwort. So sind deine Einträge auf Handy und Computer gleich. Du kannst die App auch ohne Anmeldung nutzen, dann bleiben die Einträge aber nur auf diesem einen Gerät.</p>\n<p class=\"note\">Wenn die Google-Anmeldung am Handy scheitert, <strong>registriere dich per E-Mail oder melde dich so an</strong>. Hast du schon ein Google-Konto bei ÇETELE: Melde dich zuerst am Computer mit Google an, lege im linken Menü unter <strong>Kontoeinstellungen</strong> ein <strong>ÇETELE-Passwort</strong> an und melde dich dann am Handy mit deiner Gmail-Adresse und diesem Passwort an. Das ÇETELE-Passwort ist unabhängig von deinem Gmail-Passwort und ändert nichts an deinem Gmail-Konto. Wenn du dich einmal auf einem Gerät angemeldet hast, wirst du erst nach dem Abmelden wieder nach dem Passwort gefragt.</p>\n<h3>Nutzung am Handy</h3>\n<ul>\n<li><strong>iPhone:</strong> Öffne die Seite in Safari. Tippe unten auf <strong>Teilen</strong> → <strong>Zum Home-Bildschirm</strong>, um sie wie eine App zu nutzen. Auf dem iPhone kann die Google-Anmeldung scheitern; melde dich dann mit E-Mail und ÇETELE-Passwort an.</li>\n<li><strong>Android:</strong> Öffne die Seite in Chrome. Tippe oben rechts auf <strong>⋮</strong> → <strong>Zum Startbildschirm hinzufügen</strong>. Die Google-Anmeldung funktioniert meist problemlos.</li>\n<li><strong>Huawei-Handys und -Tablets:</strong> Nutze auf Huawei-Geräten ohne Google-Dienste Firefox und melde dich mit E-Mail und ÇETELE-Passwort an. Achte darauf, dass in den Firefox-Einstellungen „Browserdaten beim Beenden löschen“ ausgeschaltet ist, sonst wirst du bei jedem Schließen abgemeldet.</li>\n<li>Wenn du die App zum Startbildschirm hinzugefügt hast, öffne sie immer von dort.</li>\n</ul>\n<p><strong>Lege deine Liga an.</strong> Tippe im linken Menü auf <strong>+ Neue Liga</strong> und gib ihr einen Namen.</p>\n<p><strong>Fülle „Liga einrichten“ aus:</strong></p>\n<ul>\n<li><strong>Teams:</strong> Füge alle Teams der Liga hinzu, auch dein eigenes. Kopiere die Namen aus Comunio und füge sie ein. Ist ein Name anders geschrieben als im Spiel, zählen die Transfers dieses Teams nicht für sein Budget.</li>\n<li><strong>Name des Markt-Kontos:</strong> Der Name des Computer-Kontos, das in den Transfernews des Spiels erscheint (meist „Computer“).</li>\n<li><strong>Startbudget:</strong> Das Budget, das alle zu Saisonbeginn bekommen.</li>\n<li><strong>Minus-Regel:</strong> Wähle die erste Option, wenn Teams in deiner Liga bis zu 25 % ihres Teamwerts ins Minus gehen dürfen, sonst die zweite.</li>\n</ul>\n\n<h2>2. Einstieg mitten in der Saison: Verlauf nachtragen</h2>\n<p>Damit die Kontostände stimmen, muss alles seit Saisonbeginn eingetragen sein. Das ist eine einmalige Arbeit — danach trägst du nur noch Neues ein.</p>\n<ol>\n<li><strong>Transfers:</strong> Kopiere alle Transfernews aus Comunio und füge sie ein. Schon ein fehlender Transfer macht den Kontostand dieses Teams falsch.</li>\n<li><strong>Punkteprämie:</strong> Trage die Punkte jeder Woche ein. Kennst du nur die aktuellen Gesamtpunkte, kannst du sie mit der Option „Gesamtpunkte“ auf einmal eintragen.</li>\n<li><strong>Platzierungsprämie:</strong> Wenn dein Liga-Admin eine wöchentliche Prämie zahlt, trage die Prämientabelle und die Platzierungen der vergangenen Wochen ein.</li>\n<li><strong>Teamwerte:</strong> Trage den aktuellen Teamwert aller Teams ein.</li>\n</ol>\n<p class=\"note\"><strong>Kontrolliere es:</strong> Vergleiche den Kontostand deines eigenen Teams in der Übersicht mit deinem Kontostand im Spiel. Stimmen beide überein, sind deine Einträge korrekt. Wenn nicht, fehlt ein Transfer, ein Punkteeintrag oder eine Prämie oder wurde doppelt eingetragen. Das ist auch in den folgenden Wochen die beste Kontrolle.</p>\n\n<h2>3. Wöchentliche Routine</h2>\n<ul>\n<li><strong>Wenn Transfers passieren:</strong> Füge die neuen Transfernews ein.</li>\n<li><strong>Am Ende der Woche:</strong> Trage die Punkte der Woche und, falls vorhanden, die Platzierungsprämie ein.</li>\n<li><strong>Bevor du bietest:</strong> Aktualisiere die Teamwerte und schau dir dann in der Übersicht die maximalen Gebote deiner Gegner an.</li>\n</ul>\n\n<h2>4. Die Tabs</h2>\n<h3>Übersicht</h3>\n<p>Aktueller Kontostand, Teamwert und maximales Gebot jedes Teams. Tippe auf ein Team, um alle Kontobewegungen seit Saisonbeginn zu sehen. Warnungen für Teams im Minus und veraltete Teamwerte erscheinen hier. Du kannst alle Bewegungen auch als Datei herunterladen, die sich in Excel öffnen lässt.</p>\n<h3>Teamwerte</h3>\n<p>Trage die Teamwerte ein. Sie ändern sich im Spiel ständig, gewöhn dir also an, sie vor dem Bieten zu aktualisieren.</p>\n<h3>Transfers</h3>\n<p>Füge den Text ein und tippe auf <strong>Text auslesen</strong>. Vor dem Speichern erscheint eine Vorschau — prüfe die Zahlen und korrigiere sie bei Bedarf. Ein bereits eingetragener Transfer wird als „mögliches Duplikat“ markiert und nicht gespeichert. Der Transfertext kann auf Türkisch, Englisch oder Deutsch sein.</p>\n<ul>\n<li>Tippe auf die Spaltenköpfe, um die Tabelle wie in Excel zu sortieren und zu filtern.</li>\n<li>Wähle oben eine Team-Schaltfläche, um alle Käufe und Verkäufe dieses Teams samt Gesamtsumme zu sehen.</li>\n<li>Taucht ein Name auf, der nicht in deiner Teamliste steht, erscheint oben eine Warnung, über die du ihn dem richtigen Team zuordnen kannst.</li>\n</ul>\n<h3>Punkteprämie</h3>\n<p>Im Spiel gibt es für jeden Punkt 10.000 aufs Konto. Trage die Punkte aller Teams in die Tabelle ein. Bei „Punkte dieser Woche“ werden die Punkte zur Summe addiert. Bei „Gesamtpunkte“ wird nur die Differenz zum letzten Eintrag gezählt, also nichts doppelt.</p>\n<h3>Platzierungsprämie</h3>\n<p>Das ist keine Spielregel. In manchen Ligen zahlt der Admin je nach Wochenplatzierung zusätzliches Geld. Wenn deine Liga das macht, schalte diesen Tab ein, trage die Prämientabelle ein und ziehe die Teams jede Woche in die richtige Reihenfolge.</p>\n<h3>Liga einrichten</h3>\n<p>Teams hinzufügen, umbenennen (✎) und löschen, Ligaregeln, Backups und Liga löschen.</p>\n\n<h2>5. Wie wird das maximale Gebot berechnet?</h2>\n<p class=\"formula\">Maximales Gebot = aktueller Kontostand + 25 % des Teamwerts</p>\n<p>Beispiel: Hat ein Team einen Kontostand von 5.000.000 und einen Teamwert von 80.000.000, kann es höchstens 5.000.000 + 20.000.000 = <strong>25.000.000</strong> bieten. Verwendet deine Liga die Regel „Kein Minus erlaubt“, ist das maximale Gebot einfach der aktuelle Kontostand.</p>\n<p><strong>Beachte:</strong></p>\n<ul>\n<li>Verkauft ein Gegner einen Spieler <strong>an ein anderes Team</strong>, kommt das Geld sofort an und sein maximales Gebot steigt sofort. Verkäufe an den Computer werden erst am nächsten Tag verbucht.</li>\n<li>Sind die Teamwerte veraltet, stimmt auch die Berechnung nicht.</li>\n</ul>\n\n<h2>6. Wichtige Hinweise</h2>\n<ul>\n<li><strong>Minus:</strong> Ein Team, das beim Anpfiff des ersten Spiels der Woche im Minus ist, bekommt in dieser Woche 0 Punkte. Teams im Minus sind in der Übersicht rot markiert.</li>\n<li><strong>Mach Backups:</strong> Liga einrichten → Backup → <strong>Backup herunterladen</strong>. Vor allem vor größeren Änderungen.</li>\n<li><strong>Bearbeite nicht gleichzeitig auf zwei Geräten:</strong> Die zuletzt gespeicherte Änderung gilt, die auf dem anderen Gerät kann verloren gehen.</li>\n</ul>\n\n<h2>7. Häufige Fragen</h2>\n<h3>Mein Kontostand in der Übersicht stimmt nicht mit dem Spiel überein.</h3>\n<p>Vielleicht fehlt ein Transfer oder wurde doppelt eingetragen, oder es fehlen die Punkte oder die Prämie einer Woche. Wähle im Tab „Transfers“ dein eigenes Team und vergleiche die Liste mit den News im Spiel.</p>\n<h3>Ich habe einen falschen Transfer eingetragen.</h3>\n<p>Lösche ihn mit dem ✕ am Ende seiner Zeile in der Transfertabelle und trage dann den richtigen ein.</p>\n<h3>Können die anderen Spieler meiner Liga meine Einträge sehen?</h3>\n<p>Nein. Deine Einträge liegen nur in deinem Konto.</p>\n<h3>Ein Spieler hat sein Team umbenannt.</h3>\n<p>Tippe unter „Liga einrichten“ neben dem Team auf ✎ und gib den neuen Namen ein. Alle früheren Einträge übernehmen den neuen Namen.</p>\n<h3>Die App fragt beim Öffnen nicht nach meinem Passwort.</h3>\n<p>Das ist normal. Wenn du dich einmal auf einem Gerät angemeldet hast, bleibst du angemeldet, bis du im linken Menü auf <strong>Abmelden</strong> tippst.</p>\n<h3>Ändert das ÇETELE-Passwort mein Gmail-Passwort?</h3>\n<p>Nein. Das ÇETELE-Passwort dient nur zur Anmeldung in dieser App. Dein Gmail-Konto und dein Passwort bleiben völlig unberührt.</p>\n<h3>Ich habe einen Fehler gefunden oder eine Idee.</h3>\n<p>Tippe unten im linken Menü auf <strong>Feedback senden</strong>. Deine Nachricht kommt direkt bei uns an.</p>\n"};
function renderGuide(){
  if (LANG !== 'tr' && GUIDE_HTML[LANG]) return el(`<article class="card guide" data-no-tr>${GUIDE_HTML[LANG]}</article>`);
  const wrap = el(`<article class="card guide" data-no-tr>
<h1>ÇETELE Kullanma Kılavuzu</h1>
<p class="lead">ÇETELE, Comunio liginde rakiplerinin bütçesini takip etmeni ve bir oyuncu için kimin en fazla ne kadar teklif verebileceğini görmeni sağlar. Kayıtların sadece sana aittir, ligdeki diğer oyuncular dahil kimse göremez.</p>

<h2>1. Başlarken</h2>
<p><strong>Giriş yap.</strong> Google hesabınla ya da e-posta ve şifreyle giriş yap. Böylece kayıtların telefonda ve bilgisayarda aynı olur. Giriş yapmadan da kullanabilirsin, ama o zaman kayıtlar sadece o cihazda kalır.</p>
<p class="note">Telefonda Google girişi hata verirse <strong>e-posta ile üye ol ya da giriş yap</strong>. Daha önce Google ile hesap açtıysan: önce bilgisayarda Google ile gir, sol menüdeki <strong>Hesap ayarları</strong>'ndan bir <strong>ÇETELE şifresi</strong> oluştur, sonra telefonda Gmail adresin ve bu şifreyle giriş yap. ÇETELE şifresi Gmail şifrenden ayrıdır, Gmail hesabını etkilemez. Bir cihazda bir kez giriş yaptıktan sonra, çıkış yapmadığın sürece tekrar şifre sorulmaz.</p>
<h3>Telefonda kullanım</h3>
<ul>
<li><strong>iPhone:</strong> Safari ile aç. Alttaki <strong>Paylaş</strong> düğmesi → <strong>Ana Ekrana Ekle</strong> ile uygulama gibi kullan. iPhone'da Google girişi hata verebilir; bu durumda e-posta adresin ve ÇETELE şifrenle giriş yap.</li>
<li><strong>Android:</strong> Chrome ile aç. Sağ üstteki <strong>⋮</strong> → <strong>Ana ekrana ekle</strong>. Google girişi genelde sorunsuz çalışır.</li>
<li><strong>Huawei telefon ve tabletler:</strong> Google servisleri olmayan Huawei cihazlarda Firefox kullan, e-posta adresin ve ÇETELE şifrenle giriş yap. Firefox ayarlarında "Çıkışta tarama verilerini sil" kapalı olsun, yoksa her kapatışta oturumun kapanır.</li>
<li>Ana ekrana eklediysen uygulamayı hep oradan aç.</li>
</ul>
<p><strong>Ligini oluştur.</strong> Sol menüden <strong>+ Yeni Lig</strong>'e bas, ligine bir ad ver.</p>
<p><strong>Lig Kurulumu'nu doldur:</strong></p>
<ul>
<li><strong>Takımlar:</strong> Ligdeki tüm takımları, kendin dahil ekle. Adları Comunio'dan kopyalayıp yapıştır. Adlar oyundakinden farklı yazılırsa o takımın transferleri bütçesine yansımaz.</li>
<li><strong>Market hesabının adı:</strong> Oyunda transfer bildirimlerinde görünen bilgisayar hesabının adı (genelde "Computer").</li>
<li><strong>Başlangıç bütçesi:</strong> Sezon başında herkese verilen bütçe.</li>
<li><strong>Eksi bütçe kuralı:</strong> Liginde takımlar kadro değerinin %25'ine kadar eksiye düşebiliyorsa onu, hiç düşemiyorsa diğerini seç.</li>
</ul>

<h2>2. Sezon ortasında başlıyorsan: geçmişi gir</h2>
<p>Bütçe hesabının doğru olması için sezon başından bu yana olan her şeyin girilmesi gerekir. Bu ilk seferlik bir iş, sonrasında sadece yeni hareketleri eklersin.</p>
<ol>
<li><strong>Transferler:</strong> Comunio'daki tüm transfer haberlerini kopyalayıp yapıştır. Tek bir eksik transfer, o takımın bütçesini yanlış gösterir.</li>
<li><strong>Puan Bonusu:</strong> Her haftanın puanlarını gir. Sadece güncel toplam puanları biliyorsan "Toplam puan" seçeneğiyle tek seferde girebilirsin.</li>
<li><strong>Sıralama Bonusu:</strong> Liginde lig yöneticisinin verdiği haftalık bonus varsa, bonus tablosunu ve geçmiş haftaların sıralamalarını gir.</li>
<li><strong>Kadro Değerleri:</strong> Tüm takımların güncel kadro değerini gir.</li>
</ol>
<p class="note"><strong>Kontrol et:</strong> Dashboard'da kendi takımının bütçesine bak ve oyundaki bütçenle karşılaştır. İkisi aynıysa kayıtların doğru demektir. Farklıysa eksik ya da iki kez girilmiş bir transfer, puan ya da bonus vardır. Aynı yöntem sonraki haftalarda da en iyi kontrol yolundur.</p>

<h2>3. Haftalık rutin</h2>
<ul>
<li><strong>Transferler oldukça:</strong> Yeni transfer haberlerini yapıştır.</li>
<li><strong>Hafta bitince:</strong> Haftanın puanlarını ve varsa sıralama bonusunu gir.</li>
<li><strong>Teklif vermeden önce:</strong> Kadro değerlerini güncelle, sonra Dashboard'da rakiplerinin maksimum teklifine bak.</li>
</ul>

<h2>4. Sekmeler</h2>
<h3>Dashboard</h3>
<p>Her takımın güncel bütçesi, kadro değeri ve maksimum teklifi. Bir takıma dokunursan sezon başından bu yana tüm bütçe hareketlerini görürsün. Eksi bütçedeki takımlar ve güncel olmayan kadro değerleri için uyarılar burada çıkar. Tüm hareketleri Excel'de açılabilen bir dosya olarak da indirebilirsin.</p>
<h3>Kadro Değerleri</h3>
<p>Takımların kadro değerlerini gir. Değerler oyunda sürekli değiştiği için teklif vermeden önce güncellemeyi alışkanlık yap.</p>
<h3>Transferler</h3>
<p>Metni yapıştırıp <strong>Metni ayrıştır</strong>'a bas. Kaydetmeden önce bir önizleme tablosu çıkar, rakamları kontrol et, gerekirse düzelt. Daha önce girilmiş bir transfer "olası mükerrer" olarak işaretlenir ve kaydedilmez. Transfer metni Türkçe, İngilizce ya da Almanca olabilir.</p>
<ul>
<li>Tablodaki sütun başlıklarına dokunarak sıralayabilir ve Excel'deki gibi filtreleyebilirsin.</li>
<li>Üstteki takım düğmelerinden birini seçersen o takımın tüm alış ve satışları listelenir, toplam bedel de görünür.</li>
<li>Takım listende olmayan bir ad geçerse üstte uyarı çıkar, oradan o adı doğru takıma bağlayabilirsin.</li>
</ul>
<h3>Puan Bonusu</h3>
<p>Oyunda her puan için 10.000 bütçe eklenir. Tabloya tüm takımların puanını gir. "Bu haftanın puanı" seçersen puan toplama eklenir. "Toplam puan" seçersen sadece önceki kayıttan farkı işlenir, çift sayılmaz.</p>
<h3>Sıralama Bonusu</h3>
<p>Oyunun kuralı değildir. Bazı liglerde lig yöneticisi haftalık sıralamaya göre ek para dağıtır. Liginde böyle bir şey varsa bu sekmeyi aç, bonus tablosunu gir, her hafta takımları sürükleyerek sırala.</p>
<h3>Lig Kurulumu</h3>
<p>Takım ekleme, adını değiştirme (✎) ve silme, lig kuralları, yedekleme ve ligi silme.</p>

<h2>5. Maksimum teklif nasıl hesaplanır?</h2>
<p class="formula">Maksimum teklif = mevcut bütçe + kadro değerinin %25'i</p>
<p>Örnek: Bir takımın bütçesi 5.000.000, kadro değeri 80.000.000 ise, bu takım 5.000.000 + 20.000.000 = en fazla <strong>25.000.000</strong> teklif verebilir. Ligin "hiç eksiye düşemez" kuralını kullanıyorsa maksimum teklif sadece mevcut bütçesidir.</p>
<p><strong>Dikkat edilmesi gerekenler:</strong></p>
<ul>
<li>Rakip bir oyuncusunu <strong>başka bir takıma</strong> satarsa parası hemen gelir, maksimum teklifi o an artar. Computer'a yaptığı satışlar ise ertesi gün işlenir.</li>
<li>Kadro değerleri güncel değilse hesap da yanlış olur.</li>
</ul>

<h2>6. Önemli hatırlatmalar</h2>
<ul>
<li><strong>Eksi bütçe:</strong> Haftanın ilk maçı başladığında bütçesi eksi olan takım o hafta 0 puan alır. Dashboard'da eksi bütçedeki takımlar kırmızıyla işaretlenir.</li>
<li><strong>Yedek al:</strong> Lig Kurulumu → Yedekleme → <strong>Yedek indir</strong>. Özellikle büyük değişikliklerden önce.</li>
<li><strong>Aynı anda iki cihazda düzenleme yapma:</strong> Son kaydedilen geçerli olur, diğer cihazdaki değişiklik kaybolabilir.</li>
</ul>

<h2>7. Sık sorulan sorular</h2>
<h3>Dashboard'daki bütçem oyundakiyle tutmuyor.</h3>
<p>Eksik ya da iki kez girilmiş bir transfer, eksik haftalık puan ya da bonus olabilir. Transferler sekmesinde kendi takımını seçip listeyi oyundaki haberlerle karşılaştır.</p>
<h3>Yanlış bir transfer girdim.</h3>
<p>Transferler tablosunda satırın sonundaki ✕ ile sil, sonra doğrusunu gir.</p>
<h3>Ligdeki diğer oyuncular kayıtlarımı görebilir mi?</h3>
<p>Hayır. Kayıtların sadece senin hesabında durur.</p>
<h3>Bir oyuncu takımının adını değiştirdi.</h3>
<p>Lig Kurulumu'nda o takımın yanındaki ✎'e bas, yeni adı yaz. Geçmiş kayıtların hepsi yeni ada geçer.</p>
<h3>Uygulama açılırken şifre sormuyor.</h3>
<p>Normal. Bir cihazda bir kez giriş yaptıktan sonra, sol menüden <strong>Çıkış yap</strong> demediğin sürece oturumun açık kalır.</p>
<h3>ÇETELE şifresi Gmail şifremi değiştirir mi?</h3>
<p>Hayır. ÇETELE şifresi sadece bu uygulamaya giriş içindir. Gmail hesabın ve şifren bundan hiç etkilenmez.</p>
<h3>Bir hata buldum ya da bir önerim var.</h3>
<p>Sol menünün altındaki <strong>Geri bildirim gönder</strong>'e bas. Mesajın doğrudan bize ulaşır.</p>
</article>`);
  return wrap;
}

function renderKurulum(){
  const lg = state.current;
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`
    <div class="card">
      <h2>${escapeHtml(lg.name)}</h2>
      <div class="sub">Temel lig ayarları</div>
      <div class="grid2">
        <div class="field"><label>Lig adı</label><input id="f-name" value="${escapeHtml(lg.name)}"></div>
        <div class="field"><label>Market/Bot hesabının adı (örn. Computer)</label><input id="f-market" value="${escapeHtml(lg.marketName)}"></div>
        <div class="field"><label>Başlangıç bütçesi</label><input id="f-start" class="num" value="${lg.startingBudget}"></div>
        <div class="field">
          <label>Eksi bütçe kuralı</label>
          <select id="f-negrule">
            <option value="0.25" ${lg.negativeBudgetRule===0.25?'selected':''}>Kadro değerinin %25'ine kadar eksiye düşebilir</option>
            <option value="0" ${lg.negativeBudgetRule===0?'selected':''}>Hiç eksiye düşemez</option>
          </select>

        if (lg.teams.some((x, j) => j !== i && normName(x) === normName(nn))) { toast('Bu adda bir takım zaten var.'); return; }

function renameTeam(lg, oldName, newName){
  const n = normName(oldName);
  lg.teams = lg.teams.map(x => x === oldName ? newName : x);
  (lg.transfers || []).forEach(tr => {
    if (normName(tr.from) === n) tr.from = newName;
    if (normName(tr.to) === n) tr.to = newName;
  });
  (lg.pointsLog || []).forEach(p => { if (p.team === oldName) p.team = newName; });
  (lg.adminBonusLog || []).forEach(e => { e.ranking = (e.ranking || []).map(x => x === oldName ? newName : x); });
  if (lg.squadValues && lg.squadValues[oldName]) { lg.squadValues[newName] = lg.squadValues[oldName]; delete lg.squadValues[oldName]; }
  const v = state.trView;
  v.teams = v.teams.map(x => x === oldName ? newName : x);
  ['player', 'from', 'to'].forEach(c => { if (v.filters[c]) v.filters[c] = v.filters[c].map(x => x === oldName ? newName : x); });
}

function openDeleteLeagueModal(lg){
  const overlay = el(`<div class="overlay"></div>`);
  const modal = el(`
    <div class="modal" style="max-width:440px;">
      <h3>${$t('"{name}" silinsin mi?', { name: escapeHtml(lg.name) })}</h3>
      <p class="sub" style="margin-top:-6px;">${$t('Ligdeki {n} transfer ve diğer tüm kayıtlar kalıcı olarak silinecek. Onaylamak için lig adını aşağıya aynen yaz.', { n: (lg.transfers || []).length })}</p>
      <div class="field"><input class="confirm-name" placeholder="${escapeHtml(lg.name)}" autocomplete="off"></div>
      <div class="row">
        <button class="cancel" style="flex:1;">Vazgeç</button>
        <button class="danger go" style="flex:1;" disabled>Kalıcı olarak sil</button>
      </div>
    </div>
  `);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
  const input = modal.querySelector('.confirm-name');
  const go = modal.querySelector('.go');
  input.focus();
  input.oninput = () => { go.disabled = input.value.trim() !== lg.name.trim(); };
  modal.querySelector('.cancel').onclick = () => overlay.remove();
  overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
  go.onclick = async () => {
    go.disabled = true;
    const ok = await deleteLeague(lg.id);
    if (!ok) { go.disabled = false; return; }
    overlay.remove();
    state.leagues = await listLeagues();
    if (state.leagues.length) {
      state.current = await loadLeague(state.leagues[0].id);
      setLastLeagueId(state.current.id);
    } else {
      state.current = null;
      try { localStorage.removeItem('kd_last_league'); } catch(e){}
    }
    state.tab = 'kurulum';
    recompute(); render();
    toast($t('"{name}" silindi.', { name: lg.name }));
  };
}

  const card = el(`

  `);

    localLeagues().then(locals => {

      const b = el(`<button class="bk-mig" style="flex:0 0 auto;">${$t('Bu cihazdaki {n} yerel ligi hesabıma aktar', { n: locals.length })}</button>`);

        const ok = await showConfirm('Bu cihazda giriş yapmadan girdiğin ligler hesabına aktarılsın mı? Hesabında aynı lig varsa üzerine yazılır.', 'Aktar', false);
        if (!ok) return;
        const n = await migrateLocalToCloud();
        await loadAndRender();
        toast($t('{n} lig hesabına aktarıldı.', { n }));
      };
      card.querySelector('.row').appendChild(b);
    }).catch(() => {});
  }
  card.querySelector('.bk-down').onclick = async () => {
    if (!downloadsCap) { toast('İndirme bu görünümde desteklenmiyor.'); return; }
    const leagues = [];
    for (const l of await listLeagues()) { const full = await loadLeague(l.id); if (full) leagues.push(full); }
    const payload = { app: 'cetele', version: 1, exportedAt: nowIso(), leagues };
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    try { await downloadsCap.save({ filename: `cetele_yedek_${stamp}.json`, data: JSON.stringify(payload) }); }
    catch(e){ toast('İndirme iptal edildi veya başarısız.'); }
  };
  card.querySelector('.bk-up').onclick = () => fileIn.click();
  fileIn.onchange = async () => {
    const f = fileIn.files && fileIn.files[0];
    fileIn.value = '';
    if (!f) return;
    let payload;
    try { payload = JSON.parse(await f.text()); } catch(e){ toast('Dosya okunamadı.'); return; }
    if (!payload || payload.app !== 'cetele' || !Array.isArray(payload.leagues)) { toast('Bu bir ÇETELE yedek dosyası değil.'); return; }
    const existing = new Set((await listLeagues()).map(l => l.id));
    const overwrite = payload.leagues.filter(l => existing.has(l.id)).length;
    const ok = await showConfirm(overwrite ? $t('{n} lig yüklenecek, bunlardan {k} tanesi aynı ligin üzerine yazılacak. Devam edilsin mi?', { n: payload.leagues.length, k: overwrite }) : $t('{n} lig yüklenecek. Devam edilsin mi?', { n: payload.leagues.length }), 'Geri yükle', false);
    if (!ok) return;
    for (const l of payload.leagues) {
      if (!l || !l.id) continue;
      const { id, ...body } = l;
      await db.doc('leagues/' + id).set(body);
    }
    state.leagues = await listLeagues();
    const first = payload.leagues[0];
    if (first && first.id) { state.current = await loadLeague(first.id); setLastLeagueId(first.id); }
    recompute(); render();
    toast('Yedek geri yüklendi.');
  };
  return card;
}

// ---------- transfer table: Excel-style sort & filter ----------
const TR_COLS = [
  { key: 'player', label: 'Oyuncu' },
  { key: 'from', label: 'Kimden' },
  { key: 'to', label: 'Kime' },
  { key: 'amount', label: 'Bedel', num: true },
];
let menuCleanup = null;
function closeMenu(){ if (menuCleanup) { const f = menuCleanup; menuCleanup = null; f(); } }

function applyTrView(all, v, exceptCol){
  const rows = all.filter(tr => {
    for (const col of ['player', 'from', 'to']) {
      if (col === exceptCol) continue;
      const f = v.filters[col];
      if (f && !f.includes(tr[col])) return false;
    }
    if (exceptCol !== 'amount') {
      if (v.amtMin != null && tr.amount < v.amtMin) return false;
      if (v.amtMax != null && tr.amount > v.amtMax) return false;
    }
    if (v.teams.length && !(v.teams.includes(tr.from) || v.teams.includes(tr.to))) return false;
    return true;
  });
  const dir = v.sortDir === 'asc' ? 1 : -1;
  const k = v.sortKey;
  rows.sort((a, b) => {
    if (k === 'amount') return (a.amount - b.amount) * dir;
    if (k === 'addedAt') return (a.addedAt || '').localeCompare(b.addedAt || '') * dir;
    return String(a[k]).localeCompare(String(b[k]), 'tr', { sensitivity: 'base' }) * dir
      || (b.addedAt || '').localeCompare(a.addedAt || '');
  });
  return rows;
}

function isColFiltered(v, col){
  if (col === 'amount') return v.amtMin != null || v.amtMax != null;
  return !!v.filters[col];
}

function renderTransferTable(host){
  closeMenu();
  const lg = state.current;
  const v = state.trView;
  host.innerHTML = '';
  const all = lg.transfers || [];
  if (!all.length) { host.appendChild(el(`<div class="empty">Henüz transfer kaydı yok.</div>`)); return; }

  const chips = el(`<div class="chips"><span class="small muted">Takım:</span></div>`);
  lg.teams.forEach(t => {
    const on = v.teams.includes(t);
    const b = el(`<button class="chip ${on ? 'on' : ''}" aria-pressed="${on}">${escapeHtml(t)}</button>`);
    b.onclick = () => { v.teams = on ? v.teams.filter(x => x !== t) : [...v.teams, t]; renderTransferTable(host); };
    chips.appendChild(b);
  });
  host.appendChild(chips);

  const rows = applyTrView(all, v, null);
  const total = rows.reduce((a, r) => a + r.amount, 0);
  const anyActive = v.teams.length || ['player', 'from', 'to', 'amount'].some(c => isColFiltered(v, c)) || v.sortKey !== 'addedAt';
  const summary = el(`<div class="summary-line"><span>${$t('<strong>{n}</strong> / {all} transfer gösteriliyor, toplam bedel <strong class="num">{sum}</strong>', { n: rows.length, all: all.length, sum: fmt(total) })}</span></div>`);
  if (anyActive) {
    const reset = el(`<button class="ghost small" style="color:var(--accent);">Filtreleri ve sıralamayı sıfırla</button>`);
    reset.onclick = () => {
      state.trView = { sortKey: 'addedAt', sortDir: 'desc', filters: { player: null, from: null, to: null }, teams: [], amtMin: null, amtMax: null };
      renderTransferTable(host);
    };
    summary.appendChild(reset);
  }
  host.appendChild(summary);

  const t = el(`<div style="overflow-x:auto;"><table class="data"><thead><tr></tr></thead><tbody></tbody></table></div>`);
  const headRow = t.querySelector('thead tr');
  TR_COLS.forEach(c => {
    const sorted = v.sortKey === c.key;
    const filtered = isColFiltered(v, c.key);
    const ind = sorted ? (v.sortDir === 'asc' ? '↑' : '↓') : '▾';
    const th = el(`<th class="${c.num ? 'amt' : ''}"><button class="fh-btn ${sorted || filtered ? 'active' : ''}" aria-haspopup="dialog">
      ${c.label}${filtered ? '<span class="fdot" title="Filtre uygulandı"></span>' : ''}<span class="ind">${ind}</span></button></th>`);
    th.querySelector('button').onclick = (e) => { e.stopPropagation(); openColumnMenu(e.currentTarget, c, host); };
    headRow.appendChild(th);
  });
  headRow.appendChild(el(`<th></th>`));

  const tbody = t.querySelector('tbody');
  if (!rows.length) tbody.appendChild(el(`<tr><td colspan="5" class="empty">Filtrelere uyan transfer yok.</td></tr>`));
  rows.forEach(tr => {
    const row = el(`<tr>
      <td>${escapeHtml(tr.player)}</td>
      <td>${escapeHtml(tr.from)}</td>
      <td>${escapeHtml(tr.to)}</td>
      <td class="amt num">${fmt(tr.amount)}</td>
      <td style="text-align:right;"><button class="icon-btn" title="Sil">✕</button></td>
    </tr>`);
    row.querySelector('button').onclick = async () => {
      const ok = await showConfirm('Bu transferi silmek istediğine emin misin?');
      if (!ok) return;
      lg.transfers = lg.transfers.filter(x => x.id !== tr.id);
      await persist();
    };
    tbody.appendChild(row);
  });
  host.appendChild(t);
}

function openColumnMenu(anchor, col, host){
  closeMenu();
  const lg = state.current;
  const v = state.trView;
  const menu = el(`<div class="colmenu" role="dialog" aria-label="${$t('{col} sütunu', { col: $t(col.label) })}"></div>`);
  const asc = el(`<button class="menu-item">${col.num ? 'Küçükten büyüğe sırala' : 'A → Z sırala'}</button>`);
  const desc = el(`<button class="menu-item">${col.num ? 'Büyükten küçüğe sırala' : 'Z → A sırala'}</button>`);
  asc.onclick = () => { v.sortKey = col.key; v.sortDir = 'asc'; renderTransferTable(host); };
  desc.onclick = () => { v.sortKey = col.key; v.sortDir = 'desc'; renderTransferTable(host); };
  menu.append(asc, desc, el(`<div class="menu-sep"></div>`));

  let apply, clear;
  if (col.num) {
    const box = el(`<div>
      <div class="field"><label>En az</label><input class="num mn" value="${v.amtMin ?? ''}" placeholder="örn. 1.000.000"></div>
      <div class="field"><label>En çok</label><input class="num mx" value="${v.amtMax ?? ''}" placeholder="boş = sınırsız"></div>
    </div>`);
    menu.appendChild(box);
    apply = () => { v.amtMin = toNum(box.querySelector('.mn').value); v.amtMax = toNum(box.querySelector('.mx').value); renderTransferTable(host); };
    clear = () => { v.amtMin = null; v.amtMax = null; renderTransferTable(host); };
  } else {
    const base = applyTrView(lg.transfers || [], v, col.key);
    const counts = new Map();
    base.forEach(r => counts.set(r[col.key], (counts.get(r[col.key]) || 0) + 1));
    const values = [...counts.keys()].sort((a, b) => String(a).localeCompare(String(b), 'tr', { sensitivity: 'base' }));
    const sel = new Set(v.filters[col.key] ? v.filters[col.key].filter(x => counts.has(x)) : values);
    const box = el(`<div>
      <input class="search" placeholder="Ara…" style="margin-bottom:6px;">
      <label class="chk" style="font-weight:600;"><input type="checkbox" class="all"> Tümünü seç</label>
      <div class="menu-list"></div>
    </div>`);
    menu.appendChild(box);
    const list = box.querySelector('.menu-list');
    const allBox = box.querySelector('.all');
    const search = box.querySelector('.search');
    const visible = () => values.filter(x => normName(x).includes(normName(search.value)));
    function syncAll(){
      const vis = visible();
      allBox.checked = vis.length > 0 && vis.every(x => sel.has(x));
      allBox.indeterminate = !allBox.checked && vis.some(x => sel.has(x));
    }
    function drawList(){
      list.innerHTML = '';
      const vis = visible();
      if (!vis.length) list.appendChild(el(`<div class="small muted" style="padding:6px;">Sonuç yok</div>`));
      vis.forEach(x => {
        const item = el(`<label class="chk"><input type="checkbox" ${sel.has(x) ? 'checked' : ''}><span style="flex:1;">${escapeHtml(x)}</span><span class="small muted">${counts.get(x)}</span></label>`);
        item.querySelector('input').onchange = (e) => { if (e.target.checked) sel.add(x); else sel.delete(x); syncAll(); };
        list.appendChild(item);
      });
      syncAll();
    }
    search.oninput = drawList;
    allBox.onchange = () => { visible().forEach(x => allBox.checked ? sel.add(x) : sel.delete(x)); drawList(); };
    drawList();
    apply = () => {
      if (!sel.size) { toast('En az bir değer seç.'); return; }
      v.filters[col.key] = values.every(x => sel.has(x)) ? null : [...sel];
      renderTransferTable(host);
    };
    clear = () => { v.filters[col.key] = null; renderTransferTable(host); };
  }
  const actions = el(`<div class="row" style="margin-top:4px;"><button class="clr" style="flex:1;">Temizle</button><button class="primary ok" style="flex:1;">Uygula</button></div>`);
  actions.querySelector('.clr').onclick = clear;
  actions.querySelector('.ok').onclick = apply;
  menu.appendChild(actions);

  document.body.appendChild(menu);
  const r = anchor.getBoundingClientRect();
  const w = menu.offsetWidth;
  menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8)) + 'px';
  const top = r.bottom + 6;
  const h = menu.offsetHeight;
  menu.style.top = (top + h > window.innerHeight - 8 ? Math.max(8, r.top - h - 6) : top) + 'px';
  const first = menu.querySelector('.search') || menu.querySelector('input') || asc;
  first.focus();

  const onDown = (e) => { if (!menu.contains(e.target)) closeMenu(); };
  const onKey = (e) => { if (e.key === 'Escape') closeMenu(); };
  const onScroll = (e) => { if (!menu.contains(e.target)) closeMenu(); };
  setTimeout(() => {
    document.addEventListener('mousedown', onDown);
    document.addEventListener('touchstart', onDown, { passive: true });
  }, 0);
  document.addEventListener('keydown', onKey);
  window.addEventListener('scroll', onScroll, true);
  window.addEventListener('resize', closeMenu);
  menuCleanup = () => {
    document.removeEventListener('mousedown', onDown);
    document.removeEventListener('touchstart', onDown);
    document.removeEventListener('keydown', onKey);
    window.removeEventListener('scroll', onScroll, true);
    window.removeEventListener('resize', closeMenu);
    menu.remove();
  };
}

function parseTransferText(text){
  const results = [];
  if (!text) return results;
  const N = "[A-Za-zÇĞİÖŞÜçğıöşüÄäÖöÜüß0-9'’.\\- ]";
  const formats = [
    // English: "Player transfers for 1,234,567 from A to B."
    new RegExp('^\\s*(' + N + '+?)\\s+transfers\\s+for\\s+([\\d.,]+)\\s+from\\s+(' + N + '+?)\\s+to\\s+(' + N + '+?)\\s*\\.?\\s*$', 'i'),
    // German: "Player wechselt für 1.234.567 von A zu B."
    new RegExp('^\\s*(' + N + '+?)\\s+wechselt\\s+für\\s+([\\d.,]+)\\s+von\\s+(' + N + '+?)\\s+zu\\s+(' + N + '+?)\\s*\\.?\\s*$', 'i'),
    // Turkish: "Player 1.234.567 bonservis bedeli ile A'dan B'a transfer oldu."
    new RegExp("^\\s*(?:\\d{1,2}:\\d{2}\\s*-\\s*)?(" + N + "+?)\\s+([\\d.,]+)\\s+bonservis bedeli ile\\s+(" + N + "+?)['’](?:dan|den|tan|ten)\\s+(" + N + "+?)['’](?:a|e|ya|ye)?\\s*transfer oldu\\.?\\s*$", 'i'),
  ];
  const clean = x => x.trim().replace(/^\d{1,2}:\d{2}\s*-\s*/, '');
  // Text copied from the Comunio news page puts linked names (player, teams) on their own lines.
  // For every line, take the shortest run of lines ending there that forms one complete transfer,
  // so split lines are joined but separate transfers (or header lines above them) never merge.
  const lines = text.replace(/\r/g, '').split('\n').map(l => l.replace(/\s+/g, ' ').trim()).filter(Boolean);
  const matchOne = str => { for (const re of formats) { const m = str.match(re); if (m) return m; } return null; };
  let used = 0;
  for (let end = 0; end < lines.length; end++) {
    for (let start = end; start >= Math.max(used, end - 6); start--) {
      const m = matchOne(lines.slice(start, end + 1).join(' '));
      if (m) {
        results.push({ player: clean(m[1]), amount: parseAmount(m[2]), from: m[3].trim(), to: m[4].trim() });
        used = end + 1;
        break;
      }
    }
  }
  return results;
}

async function handleScreenshotUpload(files){
  if (!sampleFn) { toast('Görsel okuma bu görünümde kullanılamıyor.'); return; }
  if (busy) return;
  files = limitFiles(files);
  busy = true;
  const close = showBusy('Transfer görüntüsü okunuyor…');
  try {
    const prompt = `Bu görsel(ler), bir fantezi futbol ligi (Comunio) oyununun transfer bildirim ekranı. Görselde geçen HER transfer satırını eksiksiz çıkar.
Her satır üç formattan birinde olabilir:
1) "PlayerName transfers for 1,234,567 from A to B."
3) Almanca: "PlayerName wechselt für 1.234.567 von A zu B."
2) Türkçe: "PlayerName 1.234.567 bonservis bedeli ile A'dan B'a transfer oldu." (başında "04:33 -" gibi bir saat olabilir, onu yok say)
Yalnızca şu JSON dizisini döndür, başka metin yazma:
[{"player": "...", "amount": 1234567, "from": "...", "to": "..."}]
- amount tam sayı olmalı (nokta/virgül ayraçları kaldırılmış). Rakamları çok dikkatli oku.
- from ve to: takım/hesap adlarını Türkçe ekler olmadan, görseldeki gibi birebir yaz ("Kara Kartal'a" → "Kara Kartal").
- Hiç transfer satırı yoksa [] döndür.`;
    const data = await sampleFn.json(prompt, { images: files });
    const arr = Array.isArray(data) ? data : (data && Array.isArray(data.transfers) ? data.transfers : []);
    const parsed = arr.map(x => ({
      player: String(x.player || '').trim(),
      amount: toNum(x.amount),
      from: String(x.from || '').trim(),
      to: String(x.to || '').trim(),
    })).filter(x => x.player && x.from && x.to && x.amount != null);
    close();
    if (!parsed.length) { toast('Görselde transfer satırı bulunamadı.'); return; }
    openPreviewModal(parsed);
  } catch(e){
    console.error(e);
    close();
    toast(sampleErrorText(e));
  } finally {
    busy = false;
    close();
  }
}

  }
